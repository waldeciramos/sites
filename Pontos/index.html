<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Infinity Ponto</title>
<style>
:root{--bg:#eef3f8;--cd:#fff;--c2:#dfe8f3;--tx:#0f2a4a;--mu:#5d7290;--ac:#0f2a4a;--pu:#ffb400;--ok:#12a36b;--wa:#d98a00;--bad:#d9382e;--bd:#d3deec}
@media(prefers-color-scheme:dark){:root{--bg:#0a1524;--cd:#12233b;--c2:#1a3050;--tx:#e6eefb;--mu:#8ba2c4;--ac:#e6eefb;--ok:#38d39a;--wa:#ffb400;--bad:#ff6b5e;--bd:#223a5e}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px system-ui,'Segoe UI',sans-serif;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);font-variant-numeric:tabular-nums}
.h{display:none!important}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 4px}
header b{font-size:20px;letter-spacing:.5px}header span{font-size:12px;color:var(--mu)}
main{padding:8px 16px calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
.dial{position:relative;width:min(78vw,300px);margin:8px auto 18px}
.dial svg{width:100%;display:block;transform:rotate(-90deg)}
.dial .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tempo{font-size:38px;font-weight:700;letter-spacing:1px}#st{font-size:13px;color:var(--mu)}
.big{width:100%;height:68px;border:0;border-radius:34px;background:var(--ac);color:var(--bg);font-size:18px;font-weight:700;cursor:pointer;transition:transform .12s}
.big:active{transform:scale(.97)}.big:disabled{opacity:.35}
.big[data-c=entrada]{background:var(--pu);color:#3b2a00}.big[data-c=saida]{background:var(--bad);color:#fff}
.ghost{background:none;border:1px solid var(--bd);border-radius:14px;padding:10px 14px;cursor:pointer}
.sem{display:block;margin:10px auto 0;font-size:13px;color:var(--mu)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0 14px;position:relative}
.tl:before{content:"";position:absolute;left:12%;right:12%;top:7px;height:2px;background:var(--bd)}
.tl div{text-align:center;font-size:12px;color:var(--mu);position:relative}
.tl i{display:block;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--bd);margin:0 auto 6px}
.tl div.on i{background:var(--pu);border-color:var(--pu)}.tl b{display:block;color:var(--tx);font-size:15px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st3 div,.box{background:var(--cd);border-radius:16px;padding:12px}
.st3 span,.lb{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}.st3 b{font-size:17px}
.box{margin-bottom:12px}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nv button{width:38px;height:38px;border-radius:50%;border:0;background:var(--c2);font-size:18px;cursor:pointer}
.sm{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--mu);margin-bottom:4px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dc{aspect-ratio:1;border-radius:10px;background:var(--cd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer}
.dc small{font-size:9px;font-weight:600}.dc.v{background:none;cursor:default}.dc.w{opacity:.45}
.dc.ok{background:var(--ok);color:#fff}.dc.pa{background:var(--wa);color:#2b1c00}.dc.fa{background:var(--bad);color:#fff}
.dc.hj{outline:3px solid var(--pu);outline-offset:1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rs div{background:var(--cd);border-radius:14px;padding:10px}.rs b{font-size:16px}
.bar{height:10px;border-radius:6px;background:var(--c2);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pu)}
.it{display:flex;justify-content:space-between;align-items:center;background:var(--cd);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.it small{color:var(--mu)}.it .r{text-align:right}
.bd{font-size:12px;font-weight:700}.bd.ok{color:var(--ok)}.bd.pa{color:var(--wa)}.bd.fa{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:12px 0;font-size:12px;color:var(--mu);cursor:pointer}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px 0 var(--pu)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
input[type=text],input[type=number],input[type=time],input[type=date]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{font-size:12px;color:var(--mu);margin:6px 0 10px;line-height:1.5}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,440px);background:var(--cd);color:var(--tx);margin:auto}
dialog::backdrop{background:rgba(5,12,24,.6)}dialog h3{margin-bottom:12px}
.fl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.fl.t{font-size:18px;font-weight:700;border:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;padding:13px 16px;border-radius:14px;background:var(--ac);color:var(--bg);font-weight:600;z-index:9;text-align:center}
#toast.ok{background:var(--ok);color:#fff}#toast.wa{background:var(--wa);color:#2b1c00}#toast.bad{background:var(--bad);color:#fff}
</style></head><body>
<header><b>∞ Infinity</b><span id="per"></span></header>
<main>
<section id="v-hoje" class="vw">
 <div class="dial"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--bd)" stroke-width="8" stroke-dasharray="1.5 8.2"/><circle cx="100" cy="100" r="78" fill="none" stroke="var(--c2)" stroke-width="12"/><circle id="ring" cx="100" cy="100" r="78" fill="none" stroke="var(--pu)" stroke-width="12" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490" style="transition:stroke-dashoffset .6s"/></svg>
 <div class="in"><span id="tempo">00:00:00</span><span id="st">Aguardando entrada</span></div></div>
 <button id="bt" class="big" onclick="bater()">Bater entrada</button>
 <button id="sem" class="ghost sem h" onclick="bater('saida')">Encerrar sem intervalo</button>
 <div class="tl" id="tl"></div>
 <div class="st3"><div><span>Saída prevista</span><b id="prev">--:--</b></div><div><span>Saldo do dia</span><b id="sd">--:--</b></div><div><span>Intervalo</span><b id="ivl">--:--</b></div></div>
</section>
<section id="v-cal" class="vw h">
 <div class="nv"><button onclick="mm(-1)">‹</button><b id="mes" style="text-transform:capitalize"></b><button onclick="mm(1)">›</button></div>
 <div class="sm"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
 <div class="gr" id="gr"></div>
 <div class="lg"><span><i style="background:var(--ok)"></i>Trabalhado</span><span><i style="background:var(--wa)"></i>Parcial</span><span><i style="background:var(--bad)"></i>Falta</span><span><i style="outline:2px solid var(--pu)"></i>Hoje</span></div>
</section>
<section id="v-rel" class="vw h">
 <div class="box"><span class="lb" id="mt">--</span><div class="bar"><i id="mb" style="width:0"></i></div><span class="lb" id="mh">--</span></div>
 <div class="rs" id="rs"></div>
 <div class="acts"><button class="ghost" onclick="abrirEd(null)">+ Dia extra</button><button class="ghost" onclick="fech()">Fechar mês</button><button class="ghost" onclick="csv()">CSV</button></div>
 <div id="ls"></div>
</section>
<section id="v-cfg" class="vw h">
 <div class="box"><div class="g2">
 <label>Jornada (horas)<input type="number" id="c1" step="0.5"></label><label>Intervalo mín. (min)<input type="number" id="c2" step="5"></label>
 <label>Tolerância (min)<input type="number" id="c3"></label><label>Fecha no dia<input type="number" id="c4" min="1" max="31"></label>
 <label>Valor da hora (R$)<input type="number" id="c5" step="0.01"></label><label>Meta (semanas)<input type="number" id="c6"></label></div>
 <button class="big" style="height:52px" onclick="salvarCfg()">Salvar ajustes</button></div>
 <div class="box"><b>Digital / Face ID</b><p class="bk" id="digSt"></p>
 <button class="ghost" onclick="cadDigital()">Cadastrar neste aparelho</button>
 <label style="margin-top:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="cDig" style="width:auto" onchange="C.digitalAtiva=this.checked;salvar()"> Exigir digital ao bater ponto</label></div>
 <div class="box"><b>Backup</b><p class="bk" id="bkSt"></p>
 <div class="acts"><button class="ghost" onclick="escolherPasta()">Escolher pasta (PC)</button><button class="ghost" onclick="bkManual()">Salvar / compartilhar</button><button class="ghost" onclick="$('fr').click()">Restaurar</button></div></div>
 <p class="bk" style="text-align:center">Desenvolvido por Waldeci Ramos</p>
</section>
</main>
<nav id="nav"><button data-v="hoje" class="on">Hoje</button><button data-v="cal">Calendário</button><button data-v="rel">Relatório</button><button data-v="cfg">Ajustes</button></nav>
<dialog id="ed"><h3 id="edT"></h3><div class="g2">
 <label>Data<input type="date" id="fD"></label><label>Entrada<input type="time" id="fE"></label>
 <label>Saída intervalo<input type="time" id="fA"></label><label>Volta intervalo<input type="time" id="fB"></label>
 <label>Saída final<input type="time" id="fS"></label><label>Observação<input type="text" id="fO"></label></div>
 <div class="acts" style="margin:8px 0 0"><button class="big" style="height:48px;flex:1" onclick="salvarEd()">Salvar</button><button class="ghost" id="fX" onclick="delEd()">Excluir</button><button class="ghost" onclick="$('ed').close()">Cancelar</button></div></dialog>
<dialog id="fc"><h3>Fechamento do mês</h3><div id="fcB"></div><div class="acts" style="margin:14px 0 0"><button class="ghost" onclick="$('fc').close()">Fechar</button></div></dialog>
<div id="toast" class="h"></div><input type="file" id="fr" accept=".json" class="h">
<script>
const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0'),SK='infinity_ponto_v1',CK='infinity_ponto_config_v1',BIO='infinity_biometria_cred';
const CP={jornadaDiaria:5,intervaloMinimo:20,avisoAntesIntervalo:20,diaFechamento:26,tolerancia:5,valorHora:0,metaSemanas:25,digitalAtiva:false};
const jp=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let C={...CP,...jp(CK,{})},E=jp(SK,{}),mc=new Date(),edD=null,vw='hoje';
const K=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,BR=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`,
DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],fds=d=>d.getDay()%6==0,
HM=m=>{const n=m<0;m=Math.abs(Math.round(m));return(n?'-':'')+pad(m/60|0)+':'+pad(m%60)},
HMS=s=>{s=Math.max(0,Math.floor(s));return pad(s/3600|0)+':'+pad(s%3600/60|0)+':'+pad(s%60)},
TM=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m},
NOW=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60},
AG=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},
dump=()=>JSON.stringify({versao:1,dataBackup:new Date().toISOString(),config:C,registros:E},null,2);
function salvar(){localStorage.setItem(SK,JSON.stringify(E));localStorage.setItem(CK,JSON.stringify(C));idbSet('dump',dump())}
let tt;function toast(m,t='ok',ms=4000){const e=$('toast');e.textContent=m;e.className=t;clearTimeout(tt);tt=setTimeout(()=>e.className='h',ms)}

/* IndexedDB (cópia interna + pasta vinculada) */
const idb=()=>new Promise((y,n)=>{const r=indexedDB.open('infinity_backup_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>y(r.result);r.onerror=()=>n(r.error)});
async function idbGet(k){try{const d=await idb();return await new Promise(y=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>y(q.result);q.onerror=()=>y(null)})}catch{return null}}
async function idbSet(k,v){try{const d=await idb();return await new Promise(y=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>y(1);t.onerror=()=>y(0)})}catch{return 0}}

/* Backup em pasta: sobrescreve sempre o mesmo arquivo (o antigo é substituído) */
async function permPasta(){const h=await idbGet('dir');if(!h)return null;try{let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});return p==='granted'?h:null}catch{return null}}
async function backupAuto(h){const t=dump();await idbSet('dump',t);
 if(h){try{const f=await h.getFileHandle('infinity_backup.json',{create:true}),w=await f.createWritable();await w.write(t);await w.close();toast('Backup atualizado na pasta ✔','ok');return}catch{}}
 toast('Backup interno atualizado (sem pasta vinculada)','wa',5000)}
async function escolherPasta(){if(!window.showDirectoryPicker)return toast('Vincular pasta só funciona no Chrome/Edge do computador','bad',6000);
 try{const h=await showDirectoryPicker({mode:'readwrite',id:'infinity'});await idbSet('dir',h);await backupAuto(h);bkSt()}catch{}}
async function bkSt(){const h=await idbGet('dir');$('bkSt').textContent=h?`Pasta vinculada: ${h.name}. Ao bater a saída final, infinity_backup.json é substituído pelo atual.`:'Sem pasta vinculada. No celular o backup interno é atualizado a cada registro; use "Salvar / compartilhar" para guardar uma cópia.'}
async function bkManual(){const f=new File([dump()],'infinity_backup.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch{}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='infinity_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function aplicar(j){if(!j||!j.registros)throw Error('Arquivo inválido');E=j.registros;C={...CP,...j.config};salvar()}
$('fr').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!confirm('Restaurar backup e substituir os registros atuais?'))return;aplicar(j);render();toast('Backup restaurado','ok')}catch(x){toast('Erro: '+x.message,'bad')}};r.readAsText(f)};

/* Digital (WebAuthn) */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer};
const okDig=()=>!!(window.PublicKeyCredential&&navigator.credentials);
async function cadDigital(){if(!okDig())return toast('Sem suporte a digital (precisa de HTTPS)','bad');
 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Infinity Ponto'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'ponto',displayName:'Ponto Infinity'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 localStorage.setItem(BIO,b64(c.rawId));toast('Digital cadastrada','ok');digSt()}catch(e){toast('Não foi possível cadastrar: '+e.message,'bad')}}
async function digital(){const id=localStorage.getItem(BIO);if(!C.digitalAtiva||!id)return true;
 try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{id:ub64(id),type:'public-key'}],userVerification:'required',timeout:60000}});return true}catch{toast('Digital não confirmada','bad');return false}}
function digSt(){$('digSt').textContent=!okDig()?'Indisponível: abra pelo link https.':localStorage.getItem(BIO)?'Digital cadastrada neste aparelho.':'Nenhuma digital cadastrada.'}

/* Cálculo */
function calc(r,d=new Date()){const J=C.jornadaDiaria*60;if(!r||!r.entrada)return{t:0,s:-J,iv:0,st:'fa',prev:0};
 const e=TM(r.entrada),a=TM(r.saidaIntervalo),b=TM(r.voltaIntervalo),f=TM(r.saida),hj=K(d)===K(new Date());
 const end=f!=null?f:!hj?(b??a??e):(a!=null&&b==null)?a:Math.max(NOW(),e);
 const iv=a!=null&&b!=null?b-a:0,ie=iv>0?Math.max(iv,C.intervaloMinimo):0,t=end-e-ie,s=t-J;
 return{t,s,iv,st:t<=0?'fa':s<-C.tolerancia?'pa':'ok',prev:e+J+(ie||C.intervaloMinimo)}}
function per(ref=new Date()){const g=C.diaFechamento,d=ref.getDate(),m=ref.getMonth(),y=ref.getFullYear();return d>=g?{i:new Date(y,m,g),f:new Date(y,m+1,g-1)}:{i:new Date(y,m-1,g),f:new Date(y,m,g-1)}}
function resumo(){const p=per(),J=C.jornadaDiaria*60,lim=new Date();lim.setHours(23,59,59,999);let T=0,X=0,F=0,A=0,U=0,D=0,dias=[];
 for(let c=new Date(p.i);c<=p.f&&c<=lim;c.setDate(c.getDate()+1)){const d=new Date(c),r=E[K(d)],x=calc(r,d),w=fds(d);if(!w)U++;
  if(!w||r){T+=Math.max(0,x.t);if(x.st==='fa'){if(!w)F+=J}else if(x.s>0)X+=x.s;else if(x.s<0)A-=x.s}
  if(r&&x.t>0)D++;dias.push({d,r,x,w})}
 return{p,T,X,F,A,U,D,dias,saldo:T-U*J}}

/* Ação principal */
const prox=r=>!r||!r.entrada?['Bater entrada','entrada']:r.saida?['Jornada concluída','']:!r.saidaIntervalo?['Sair para intervalo','saidaIntervalo']:!r.voltaIntervalo?['Voltar do intervalo','voltaIntervalo']:['Bater saída','saida'];
async function bater(campo){const d=new Date(),r=E[K(d)];campo=campo||prox(r)[1];if(!campo)return;
 const h=campo==='saida'?await permPasta():null;
 if(!(await digital()))return;
 if(campo==='entrada'&&r&&r.entrada&&!confirm('Já existe entrada hoje. Substituir?'))return;
 const n=campo==='entrada'?{entrada:AG(),saidaIntervalo:null,voltaIntervalo:null,saida:null,obs:''}:r;n[campo]=AG();E[K(d)]=n;salvar();
 if(navigator.vibrate)navigator.vibrate(campo==='saida'?[80,60,80]:60);
 render();const x=calc(n);toast(campo==='saida'?`Saída ${n.saida} • saldo ${x.s>=0?'+':''}${HM(x.s)}`:`Registrado: ${n[campo]}`,'ok');
 if(campo==='voltaIntervalo'){const dur=TM(n.voltaIntervalo)-TM(n.saidaIntervalo);if(dur>C.intervaloMinimo)toast(`Intervalo de ${dur} min (excedeu ${dur-C.intervaloMinimo}); saída empurrada`,'wa',7000)}
 if(campo==='saida')setTimeout(()=>backupAuto(h),1500)}

/* Telas */
function rHoje(){const d=new Date(),r=E[K(d)],x=calc(r,d),J=C.jornadaDiaria*60,[tx,c]=prox(r);
 $('bt').textContent=tx;$('bt').dataset.c=c;$('bt').disabled=!c;$('sem').classList.toggle('h',!(r&&r.entrada&&!r.saidaIntervalo&&!r.saida));
 $('tempo').textContent=HMS(x.t*60);$('ring').style.strokeDashoffset=490*(1-Math.min(1,Math.max(0,x.t)/J));
 $('st').textContent=!r||!r.entrada?(fds(d)?'Fim de semana':'Aguardando entrada'):r.saida?'Jornada concluída':r.saidaIntervalo&&!r.voltaIntervalo?'Em intervalo':'Em jornada';
 $('tl').innerHTML=[['Entrada','entrada'],['Intervalo','saidaIntervalo'],['Volta','voltaIntervalo'],['Saída','saida']].map(([n,k])=>`<div class="${r&&r[k]?'on':''}"><i></i><b>${r&&r[k]||'--:--'}</b>${n}</div>`).join('');
 const on=r&&r.entrada;$('prev').textContent=on?HM(x.prev):'--:--';$('sd').textContent=on?HM(x.s):'--:--';$('sd').style.color=on?(x.s>=0?'var(--ok)':'var(--bad)'):'';$('ivl').textContent=x.iv?HM(x.iv):'--:--'}
function rCal(){const y=mc.getFullYear(),m=mc.getMonth(),g=$('gr'),h=new Date();g.innerHTML='';
 $('mes').textContent=mc.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 for(let i=0;i<new Date(y,m,1).getDay();i++)g.innerHTML+='<div class="dc v"></div>';
 for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const d=new Date(y,m,n),r=E[K(d)],x=calc(r,d),w=fds(d),e=document.createElement('div');let c='';

  e.onclick=()=>abrirEd(d);g.appendChild(e)}}
function rRel(){const R=resumo(),J=C.jornadaDiaria*60,md=C.metaSemanas*5,pc=Math.min(100,R.D/md*100);

 $('ls').innerHTML=R.dias.filter(z=>!z.w||z.r).reverse().map(({d,r,x})=>`<div class="it" onclick="abrirEd(new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()}))"><div><b>${pad(d.getDate())}/${pad(d.getMonth()+1)}</b> <small>${DS[d.getDay()]}</small><br><small>${r&&r.entrada?r.entrada+' → '+(r.saida||'em aberto'):'sem registro'}</small></div><div class="r"><b>${x.t>0?HM(x.t):'--:--'}</b><br><span class="bd ${x.st}">${r&&r.entrada?(x.s>=0?'+':'')+HM(x.s):'Falta'}</span></div></div>`).join('')}

 $('fD').value=K(d||new Date());$('fD').disabled=!!d;$('fE').value=r.entrada||'';$('fA').value=r.saidaIntervalo||'';$('fB').value=r.voltaIntervalo||'';$('fS').value=r.saida||'';$('fO').value=r.obs||'';

 E[k]={entrada:$('fE').value,saidaIntervalo:$('fA').value||null,voltaIntervalo:$('fB').value||null,saida:$('fS').value||null,obs:$('fO').value};salvar();$('ed').close();render();toast('Registro salvo','ok')}

 $('fcB').innerHTML=`<p class="bk">${BR(R.p.i)} a ${BR(R.p.f)}</p>`+L('Dias úteis',R.U)+L('Dias trabalhados',R.D)+L('Semanas equivalentes',(R.D/5).toFixed(2))+L('Horas trabalhadas',`${HM(R.T)} (${h.toFixed(2)}h)`)+L('Horas extras',HM(R.X))+L('Faltas',HM(R.F))+(vh>0?L('Valor/hora','R$ '+vh.toFixed(2).replace('.',','))+`<div class="fl t"><span>Total</span><span>R$ ${(h*vh).toFixed(2).replace('.',',')}</span></div>`:`<div class="fl t"><span>Total de horas</span><span>${h.toFixed(2)} h</span></div>`);
 $('fc').showModal()}
function csv(){const R=resumo();let s='Data;Dia;Entrada;Saida Intervalo;Volta Intervalo;Saida;Trabalhado;Saldo\n';
 R.dias.forEach(({d,r,x})=>s+=[BR(d),DS[d.getDay()],r?.entrada||'',r?.saidaIntervalo||'',r?.voltaIntervalo||'',r?.saida||'',x.t>0?HM(x.t):'',r?HM(x.s):''].join(';')+'\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));a.download=`ponto_${K(R.p.i)}_a_${K(R.p.f)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
