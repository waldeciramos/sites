<title>Partilha da África</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: capa de livro em formato de slide. Amarelo cheio, tipografia condensada leve com uma palavra em peso forte, faixas diagonais em preto, branco e oliva, título embaixo à esquerda, fotos recortadas em ângulo à direita. Visual único, sem tema escuro. */
:root{
  --y:#f5ba1e; --y2:#e0a90f; --ink:#17150d; --paper:#fffdf4; --olive:#8b8571; --soft:#f9d46a;
  --c-F:#1f3a64; --c-B:#b8381f; --c-D:#17150d; --c-BE:#7b7656; --c-P:#2d6a4f; --c-I:#6a3d6e; --c-E:#a8561b; --c-L:#fffdf4; --c-N:#f9d977; --c-O:#8b8571;
  --f:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--y);overflow-x:hidden}
body{margin:0;background:var(--y);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.deck{position:relative;max-width:1400px;margin:0 auto;min-height:calc(100dvh - 28px);display:flex;flex-direction:column}

/* arte geométrica (faixas) */
.art{position:absolute;left:50%;transform:translateX(-50%);width:100vw;max-width:none;top:0;height:clamp(90px,17vh,150px);pointer-events:none;z-index:0}
.art polygon.k{fill:var(--ink)}.art polygon.w{fill:var(--paper)}.art polygon.o{fill:var(--olive)}

.slide{scale:var(--fit,1);transform-origin:50% 0;position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3vw,48px);padding-block:clamp(110px,20vh,175px) 12px}
@media (max-width:900px){.slide{grid-template-columns:minmax(0,1fr);padding-top:100px}}

.left{display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-width:0;order:2}
@media (min-width:901px){.left{order:0}}
@media (max-width:900px){.slide:not(.intro) .left{order:0}.slide.intro .left{order:2}.slide.intro{padding-top:140px}}
.num{font-weight:200;font-size:clamp(3rem,6vw,5.4rem);line-height:.8;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num span{font-size:.38em;margin-left:.4em;opacity:.55}
.kick{font-weight:600;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;border-top:2px solid var(--ink);padding-top:10px;display:inline-block;align-self:flex-start;padding-right:40px}
h1{margin:0;font-weight:300;font-size:clamp(2.8rem,6.4vw,6.2rem);line-height:.88;letter-spacing:-.012em;text-transform:uppercase;text-wrap:balance}
h1 b{font-weight:600}
.type{margin:6px 0 0;font-weight:500;font-size:clamp(1.25rem,1.75vw,1.65rem);line-height:1.3;max-width:34em;min-height:9em;overflow-wrap:anywhere}
.type .rest{color:transparent;user-select:none}
.caret{display:inline-block;width:.42em;height:.95em;background:var(--ink);vertical-align:-.1em;margin-left:2px;animation:blink 1s steps(1) infinite}
.deck.done .caret{animation:none;opacity:0}
@keyframes blink{50%{opacity:0}}
.credit{font-weight:500;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:10px}

/* exposição */
.ex{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;min-width:0;min-height:clamp(320px,54vh,600px);position:relative}
.ex .big{grid-row:1/3}
@media (max-width:900px){.ex{order:1;min-height:0;grid-template-rows:auto}.ex .big{grid-row:auto;grid-column:1/3}.ex .sm{aspect-ratio:4/3}}
.frame{position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;text-align:center;padding:9% 9%;
  background:repeating-linear-gradient(-14deg,rgba(255,253,244,.78) 0 9px,rgba(255,253,244,.6) 9px 10px)}
.f1{clip-path:polygon(0 4%,100% 0,100% 95%,0 100%)}
.f2{clip-path:polygon(0 0,100% 5%,100% 100%,0 96%)}
.f3{clip-path:polygon(0 5%,100% 0,100% 96%,0 100%)}
.big.frame{min-height:300px}
.big.frame{aspect-ratio:auto}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame.drag{background:var(--paper)}
.slot{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;z-index:1}
.slot strong{font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--ink);color:var(--paper);border:0;padding:6px 11px;font-weight:600;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-block}
.chip:hover{background:#2e2a1a}
.frame.has .slot{display:none}
.frame.has .cap{display:none}
.rm{display:none;position:absolute;right:12%;bottom:8%;z-index:2;background:var(--ink);color:var(--paper);border:0;padding:5px 10px;font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.frame.user .rm{display:block}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:1;font-size:.78rem;font-weight:500;letter-spacing:.04em;background:var(--ink);color:var(--paper);padding:4px 12px;display:none}
.frame.has .cap{display:block}

/* mapa */
.mapwrap{display:flex;flex-direction:column;gap:8px;min-width:0;grid-row:1/3}
@media (max-width:900px){.mapwrap{grid-column:1/3;grid-row:auto}}
.mapbox{position:relative;width:min(100%,calc(68vh * .946));aspect-ratio:700/740;margin:0 auto;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapbox svg.top{clip-path:inset(0 calc(100% - var(--w,50%)) 0 0)}
.mapbox path{stroke:var(--y);stroke-width:1.2;stroke-linejoin:round;fill-rule:evenodd;transition:fill .25s}
.mapbox path:hover{opacity:.82}
.c-F{fill:var(--c-F)}.c-B{fill:var(--c-B)}.c-D{fill:var(--c-D)}.c-BE{fill:var(--c-BE)}.c-P{fill:var(--c-P)}.c-I{fill:var(--c-I)}.c-E{fill:var(--c-E)}.c-L{fill:var(--c-L)}.c-N{fill:var(--c-N)}.c-O{fill:var(--c-O)}
.grat line{stroke:var(--ink);stroke-opacity:.28;stroke-width:.8;stroke-dasharray:4 5}
.grat text{fill:var(--ink);fill-opacity:.55;font:600 9px var(--f);letter-spacing:.14em;text-transform:uppercase}
.handle{position:absolute;top:0;bottom:0;left:var(--w,50%);width:0;pointer-events:none}
.handle::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--ink)}
.handle b{position:absolute;top:50%;left:-19px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:700;font-size:1rem;transform:translateY(-50%)}
.yr{position:absolute;top:8px;background:var(--ink);color:#fffdf4;padding:6px 14px 8px;font-weight:600;font-size:clamp(2.1rem,7vw,3.6rem);line-height:.95;letter-spacing:.02em;transition:opacity .25s;z-index:2;border-bottom:4px solid var(--y)}
.yr.l{left:8px}.yr.r{right:8px}.yr.dim{opacity:.88;border-bottom-color:transparent}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-weight:500;font-size:.85rem;line-height:1.3;padding:6px 10px;max-width:220px;z-index:3;display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:500;font-size:.8rem;letter-spacing:.03em}
.legend span{display:inline-flex;align-items:center;gap:5px;transition:opacity .25s}
.legend span.off{opacity:.25}
.legend i{width:11px;height:11px;display:inline-block;outline:1px solid rgba(23,21,13,.5);outline-offset:-1px}
.stats{display:flex;gap:18px;font-weight:500}
.stat{display:flex;align-items:baseline;gap:8px;opacity:.4;transition:opacity .25s}
.stat.on{opacity:1}
.stat b{font-weight:600;font-size:1.9rem;line-height:1}
.stat span{font-size:.9rem}
.note{margin:0;font-size:.75rem;opacity:.7;line-height:1.3}

/* controles flutuantes (aparecem ao mexer, somem sozinhos) */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:min(780px,calc(100% - 24px));transform:translateX(-50%);
  background:rgba(23,21,13,.94);color:var(--paper);padding:0 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .35s,transform .35s}
.dock.hide{display:none}
.dock.moved{transform:none}
.grip{display:flex;align-items:center;justify-content:space-between;margin:0 -14px 8px;padding:6px 10px 6px 14px;background:rgba(255,253,244,.1);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-weight:500;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
.grip:active{cursor:grabbing}
.grip button{background:none;border:1px solid rgba(255,253,244,.4);color:var(--paper);width:30px;height:26px;font-size:1rem;line-height:1;padding:0}
.grip button:hover{border-color:var(--y);color:var(--y)}
.launch{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--y);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:.9}
.launch svg{width:20px;height:20px;fill:currentColor}
.launch:hover{opacity:1}
.launch[hidden]{display:none}
.nd{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin-top:4px;text-align:left}
.nd b{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:600;font-size:1.9rem;line-height:1;transition:transform .2s,background .2s}
.nd:hover b{transform:scale(1.08);background:var(--acc,#17150d)}
.nd span{font-weight:600;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;line-height:1.2}
.nd small{display:block;font-weight:500;letter-spacing:.06em;text-transform:none;font-size:1rem}
#title b,.kick b{color:var(--acc,var(--ink))}
.segs{display:flex;gap:3px;margin:0 -14px;padding:0}
.segs button{flex:1;border:0;background:rgba(255,253,244,.22);height:4px;padding:0;position:relative;margin-bottom:10px}
.segs button i{position:absolute;inset:0;width:var(--p,0%);background:var(--y)}
.segs button[aria-current="true"]{background:rgba(255,253,244,.4)}
.segs button:hover{background:rgba(255,253,244,.5)}
.thin{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:19;background:rgba(23,21,13,.18)}
.thin i{display:block;height:100%;width:0;background:var(--ink)}
.menu{position:relative}
.dots{width:42px;height:42px;border:1.5px solid rgba(255,253,244,.4);border-radius:50%;background:transparent;color:var(--paper);font-size:1.3rem;font-weight:700;line-height:1;letter-spacing:.05em}
.dots:hover{border-color:var(--y)}
.pop{position:absolute;right:0;bottom:50px;background:var(--ink);border:1px solid rgba(255,253,244,.25);min-width:200px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pop[hidden]{display:none}
.pop button,.pop label,.pop a{display:block;text-align:left;background:none;border:0;padding:11px 16px;font-weight:500;font-size:.95rem;letter-spacing:.06em;color:var(--paper);text-decoration:none;cursor:pointer}
.pop button:hover,.pop label:hover,.pop a:hover{background:rgba(255,253,244,.12);color:var(--y)}
.dock-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:8px}
.round{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,253,244,.4);background:transparent;display:grid;place-items:center;color:var(--paper)}
.round:hover{border-color:var(--y)}
.round svg{width:17px;height:17px;fill:currentColor}
.round.main{width:54px;height:54px;background:var(--y);color:var(--ink);border-color:var(--y)}
.round.main svg{width:22px;height:22px}
.dock :focus-visible{outline-color:var(--y)}
.scrub{flex:1 1 200px;display:flex;align-items:center;gap:12px;min-width:0}
.scrub time{font-weight:500;font-size:.95rem;font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
input[type=range]{flex:1;min-width:0;appearance:none;-webkit-appearance:none;height:4px;background:linear-gradient(to right,var(--y) var(--p,0%),rgba(255,253,244,.25) var(--p,0%));outline-offset:8px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--paper);border:0;border-radius:0;transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--paper);border:0;border-radius:0}
.meta{display:flex;align-items:center;gap:14px;font-weight:500;font-size:.85rem;letter-spacing:.04em}
.meta .n{font-weight:600;font-size:1.1rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.meta label,.meta button{cursor:pointer;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;color:inherit;font-weight:500}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){.meta,.scrub time{display:none}.dock-in{gap:10px;flex-wrap:nowrap}.round{width:38px;height:38px}.round.main{width:48px;height:48px}.scrub time{font-size:.8rem}.scrub{gap:8px}}

/* mapa: rótulos, legenda, abertura, popup */
.lb{opacity:0;transition:opacity .3s;font-family:var(--f);font-weight:700;font-size:12px;fill:#fffdf4;text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.02em}
.lb.dk{fill:var(--ink)}
.lb.on{opacity:1}
.say{position:absolute;left:0;top:3%;z-index:3;pointer-events:none;font-weight:600;font-size:clamp(1.5rem,4.2vw,2.8rem);line-height:1;letter-spacing:.04em;text-transform:uppercase;padding:6px 16px 9px;opacity:0;transform:translateX(-12px);transition:opacity .25s,transform .25s;background:var(--ink);color:var(--paper)}
.say.on{opacity:1;transform:none}
.say.k-BE,.say.k-L,.say.k-N{color:var(--ink)}
.mapbox svg.top path{transition:fill .25s,opacity .3s}
.mapbox svg.top path.dm{opacity:.28}
.legend span.lit{font-weight:700;font-size:1.08em;background:var(--ink);color:var(--y);padding:1px 8px 2px;outline:2px solid var(--ink)}
.legend span.lit i{outline-color:var(--y)}
.legend.has span:not(.lit){opacity:.5}
.legend span{transition:opacity .25s,background .25s,color .25s}
.hud{display:flex;align-items:center;gap:12px}
.hud .yr{position:static;font-size:clamp(2rem,6.4vw,3.2rem);padding:5px 14px 8px;flex:none;border-bottom:4px solid var(--y);transition:opacity .25s,border-color .25s}
.hud .yr.dim{opacity:.55;border-bottom-color:transparent}
.hudline{flex:1;height:6px;background:rgba(23,21,13,.25);position:relative;min-width:20px}
.hudline i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--ink)}
.hudline::after{content:"";position:absolute;right:-2px;top:-5px;border-left:10px solid rgba(23,21,13,.45);border-top:8px solid transparent;border-bottom:8px solid transparent}
.lgt{font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase}
.legend{font-size:.98rem;gap:6px 16px}
.legend i{width:17px;height:17px}
.ex.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
.ex.solo .mapwrap{grid-column:1;grid-row:1}
.ex.solo .big{grid-row:1;grid-column:1;min-height:clamp(300px,52vh,560px)}
.rbtn{align-self:flex-start;background:var(--ink);color:var(--y);border:0;padding:10px 18px;font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase}
.rbtn:hover{background:#2e2a1a}
.rbtns{display:flex;flex-wrap:wrap;gap:8px}
.rbtn.alt{background:var(--paper);color:var(--ink)}
.info{display:flex;flex-direction:column;gap:12px;align-items:flex-start;margin-top:6px}
.info .il{font-weight:600;font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;border-top:2px solid var(--ink);padding-top:10px;padding-right:40px}
.info .in{font-weight:600;font-size:clamp(2rem,4.4vw,3.6rem);line-height:.95;text-transform:uppercase}
.info .ig{display:inline-block;background:var(--ink);color:var(--paper);padding:4px 16px 6px;font-weight:600;font-size:1.7rem;letter-spacing:.06em}
.info .is{font-weight:500;font-size:1.15rem}
.slide:not(.intro) .info{display:none}
.slide.intro .type,.slide.intro .num{display:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(23,21,13,.8);display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.mbox{background:var(--y);width:min(980px,100%);height:100%;max-height:1250px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:var(--ink);color:var(--paper)}
.mhead b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:1rem}
.mbtns{display:flex;gap:8px}
.mhead button{background:var(--y);color:var(--ink);border:0;padding:8px 16px;font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.mbox iframe{flex:1;width:100%;border:0;background:#d9d6cb;min-height:0}
/* números e imagens */
.nb{position:absolute;left:10%;top:9%;z-index:2;min-width:34px;height:34px;padding:0 8px;background:var(--ink);color:var(--y);font-weight:700;font-size:1.15rem;display:grid;place-items:center;letter-spacing:.04em}
.nonum .nb{display:none}
.frame img{opacity:0;transition:opacity .3s}.frame img.ok{opacity:1}
.fname{font-weight:500;font-size:.72rem;letter-spacing:.1em;opacity:.65;text-transform:uppercase}
/* créditos */
.credits{position:relative;z-index:1;height:calc(100dvh - 210px);min-height:420px;overflow:hidden;margin-top:clamp(100px,18vh,160px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%)}
.credits.static{overflow:auto;-webkit-mask-image:none;mask-image:none}
.roll{max-width:820px;margin:0 auto;text-align:center;padding:0 8px 80px;will-change:transform}
.roll h2{font-weight:300;font-size:clamp(2.4rem,5vw,4.2rem);line-height:.9;text-transform:uppercase;margin:0 0 6px}
.roll h2 b{font-weight:600}
.roll h3{font-weight:600;font-size:1rem;letter-spacing:.22em;text-transform:uppercase;margin:46px 0 14px;border-top:2px solid var(--ink);display:inline-block;padding:10px 30px 0}
.roll p,.roll li{font-weight:500;font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.3;margin:0 0 12px;list-style:none}
.roll ul{padding:0;margin:0}
.roll a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.roll small{display:block;font-size:.8em;font-weight:400;opacity:.75}
.roll .alunos li{font-weight:600;font-size:clamp(1.5rem,3vw,2.2rem);text-transform:uppercase;margin-bottom:6px}
.roll .imgs li{font-size:clamp(1rem,1.6vw,1.2rem);margin-bottom:6px}
.roll .imgs b{display:inline-block;min-width:2.2em;background:var(--ink);color:var(--y);padding:0 6px;margin-right:8px}
.slide.credits-mode .left,.slide.credits-mode .ex{display:none}
.slide:not(.credits-mode) .credits{display:none}
.slide.credits-mode{grid-template-columns:minmax(0,1fr);padding-top:0}
.yr small{display:block;font-weight:500;font-size:.3em;letter-spacing:.2em;text-transform:uppercase;margin-top:4px;color:var(--y)}
/* descida entre slides */
.deck.leave .slide,.deck.leave .art{opacity:0;transform:translateY(calc(-14vh * var(--d,1)));transition:opacity .3s ease,transform .3s ease}
.enter .slide{animation:descend .85s cubic-bezier(.2,.75,.2,1) both}
@keyframes descend{from{opacity:0;transform:translateY(calc(55vh * var(--d,1)))}}
/* entrada do slide */
.enter .left>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.enter .left>*:nth-child(2){animation-delay:.05s}.enter .left>*:nth-child(3){animation-delay:.1s}.enter .left>*:nth-child(4){animation-delay:.18s}

const SLIDES = [{"id": 0, "kick": "Abertura", "title": "A PARTILHA<br>DA <b>ÁFRICA</b>", "view": "maponly", "wipe": [0.04, 0.68], "text": "", "plates": []}, {"id": 1, "kick": "Introdução", "title": "A PARTILHA<br>DA <b>ÁFRICA</b>", "view": "map", "wipe": [0.03, 0.97], "text": "No final do século XIX, as potências europeias ocuparam quase todo o continente africano. Esse processo ficou conhecido como a Partilha da África, e é um dos episódios mais marcantes do Imperialismo. Em poucas décadas, o mapa da África foi redesenhado, e as consequências duram até hoje.", "plates": [["Mapa da Partilha da África (1880 e 1914)", "Scramble for Africa map"], ["Charge “O Colosso de Rodes”", "Rhodes Colossus caricature"], ["Gravura de época: exploradores no interior", "Stanley Livingstone Africa engraving"]]}, {"id": 2, "kick": "Contexto histórico", "title": "DO LITORAL<br>AO <b>INTERIOR</b>", "view": "map", "wipe": [0.03, 0.97], "text": "Até por volta de 1870, os europeus dominavam apenas cerca de 10% da África, principalmente áreas no litoral. O interior era pouco conhecido por eles. Em 1914, esse número chegou a cerca de 90%. Somente a Etiópia e a Libéria continuaram independentes.", "plates": [["Mapa da África em 1880", "Africa 1880 political map"], ["Mapa da África em 1914", "Africa 1914 colonial map"], ["Cidade litorânea colonial no século XIX", "Cape Town 19th century photograph"]]}, {"id": 3, "kick": "Causas da partilha", "title": "MATÉRIA-PRIMA,<br>PODER E <b>RACISMO</b>", "view": "facts", "wipe": null, "text": "A Segunda Revolução Industrial gerou uma grande necessidade de matérias-primas, como borracha, cobre, ouro e diamantes, além de novos mercados consumidores. Havia também a rivalidade entre as potências e o nacionalismo, pois ter colônias era sinal de poder. Para justificar a dominação, os europeus criaram a ideia de uma suposta missão civilizadora, baseada no racismo científico e no darwinismo social.", "plates": [["Fábrica da Revolução Industrial", "Industrial Revolution factory 19th century"], ["Charge “O Fardo do Homem Branco”", "White Man's Burden cartoon"], ["Mina de diamantes de Kimberley", "Kimberley Big Hole 1870s"]]}, {"id": 4, "kick": "O que tornou a conquista possível", "title": "TECNOLOGIA<br>E <b>CONQUISTA</b>", "view": "facts", "wipe": null, "text": "Avanços tecnológicos facilitaram a conquista. O quinino, remédio contra a malária, permitiu que os europeus penetrassem no interior. Os navios a vapor, as ferrovias e o telégrafo facilitaram o transporte e a comunicação. Além disso, armas modernas, como a metralhadora Maxim, deram aos exércitos europeus enorme vantagem militar.", "plates": [["Metralhadora Maxim", "Maxim gun 1890s"], ["Barco a vapor no rio Congo", "steamboat Congo river 19th century"], ["Cinchona, a árvore do quinino", "Cinchona quinine plant illustration"]]}, {"id": 5, "kick": "A Conferência de Berlim · 1884–1885", "title": "FRONTEIRAS<br>TRAÇADAS EM <b>BERLIM</b>", "view": "facts", "wipe": null, "text": "Para evitar conflitos entre si, as potências europeias se reuniram em Berlim, a convite do chanceler alemão Otto von Bismarck. A Conferência durou de novembro de 1884 a fevereiro de 1885. Foram definidas regras para a ocupação do território, como o princípio da ocupação efetiva. Nenhum africano participou das decisões, e as fronteiras foram traçadas sem respeitar povos, línguas e culturas.", "plates": [["Conferência de Berlim, gravura de Adalbert von Rössler", "Berlin Conference 1884 Rössler"], ["Otto von Bismarck", "Otto von Bismarck portrait"], ["Mapa de Berlim da Conferência", "Berlin Conference Africa map 1885"]]}, {"id": 6, "kick": "O Congo de Leopoldo II", "title": "ESTADO LIVRE<br>DO <b>CONGO</b>", "view": "facts", "wipe": null, "text": "O rei Leopoldo II, da Bélgica, tornou o Congo sua propriedade pessoal, chamando-o de Estado Livre do Congo. A população foi forçada a coletar borracha e, quem não cumpria as cotas, sofria punições brutais, incluindo mutilações. Estima-se que milhões de pessoas tenham morrido. Denúncias internacionais levaram a Bélgica a assumir o controle do território em 1908.", "plates": [["Leopoldo II da Bélgica", "Leopold II of Belgium portrait"], ["Fotografias de Alice Seeley Harris (fortes)", "Alice Seeley Harris Congo photograph"], ["Charge “Rei Leopoldo e a borracha vermelha”", "Congo Free State rubber caricature"]]}, {"id": 7, "kick": "Disputas entre as potências", "title": "DO CAIRO<br>AO <b>CABO</b>", "view": "facts", "wipe": null, "text": "Cada potência buscava seus próprios objetivos. A Grã-Bretanha queria ligar o Cairo ao Cabo, no sul. A França pretendia unir o oeste ao leste do continente. Em 1898, os dois projetos se chocaram no Incidente de Fashoda, no Sudão, e a França recuou. Também participaram da partilha a Alemanha, a Bélgica, a Itália, Portugal e a Espanha.", "plates": [["Mapa da ferrovia Cabo–Cairo", "Cape to Cairo railway map"], ["Incidente de Fashoda, 1898", "Fashoda incident 1898"], ["Cecil Rhodes, o “Colosso”", "Cecil Rhodes Colossus caricature"]]}, {"id": 8, "kick": "A resistência africana", "title": "POVOS QUE<br><b>RESISTIRAM</b>", "view": "facts", "wipe": null, "text": "Os povos africanos resistiram de várias formas. Em 1896, a Etiópia, liderada por Menelik II, derrotou a Itália na Batalha de Adwa e manteve sua independência. Os zulus venceram os britânicos em Isandlwana, em 1879. Na África Oriental Alemã, a Revolta Maji-Maji, em 1905, mobilizou milhares de pessoas. Já os povos herero e nama sofreram um genocídio cometido pela Alemanha, entre 1904 e 1908.", "plates": [["Batalha de Adwa, pintura etíope", "Battle of Adwa painting"], ["Menelik II", "Menelik II portrait"], ["Batalha de Isandlwana", "Battle of Isandlwana painting"]]}, {"id": 9, "kick": "Consequências", "title": "MARCAS QUE<br><b>PERMANECEM</b>", "view": "facts", "wipe": null, "text": "A partilha deixou marcas profundas. As fronteiras artificiais uniram povos rivais e separaram povos aliados, o que alimentou conflitos étnicos. As economias foram voltadas à exportação de matérias-primas, com trabalho forçado e monoculturas. Tradições locais foram desvalorizadas. Após a Segunda Guerra Mundial, os movimentos de independência cresceram, e muitos países se tornaram independentes entre as décadas de 1950 e 1970, como Gana, em 1957.", "plates": [["Kwame Nkrumah e a independência de Gana, 1957", "Kwame Nkrumah independence Ghana 1957"], ["Mapa das independências africanas", "Africa decolonization independence map"], ["Trabalho forçado na época colonial", "colonial Africa forced labor rubber"]]}, {"id": 10, "kick": "Conclusão", "title": "LUCRO, PODER<br>E <b>PRESTÍGIO</b>", "view": "facts", "wipe": null, "text": "A Partilha da África foi resultado da busca por lucro, poder e prestígio das potências europeias, e ocorreu ignorando a vontade dos povos africanos. Entender esse processo ajuda a compreender muitos desafios atuais do continente, como desigualdades e conflitos. Ao mesmo tempo, mostra a força da resistência e da cultura africana, que permanecem vivas.", "plates": [["Mapa político atual da África", "Africa political map"], ["Cidade africana atual", "Lagos Nigeria skyline"], ["Arte e cultura africana contemporânea", "African contemporary art festival"]]}, {"id": 11, "kick": "Agradecimento", "title": "MUITO<br><b>OBRIGADO</b>", "view": "thanks", "wipe": null, "text": "", "plates": [["Foto da turma ou imagem final", "school students group photo"]]}, {"id": 12, "kick": "Bibliografia e créditos", "title": "BIBLIOGRAFIA<br>E <b>CRÉDITOS</b>", "view": "credits", "wipe": null, "text": "", "plates": []}];

\n.row{left:110mm;width:92mm;display:flex;align-items:center;justify-content:space-between}\n.row *{position:static}\n.r1{top:99.5mm}.r2{top:163.5mm}\n.chip{background:var(--y);color:var(--ink);padding:1.2mm 3mm 1.5mm;font:700 10pt/1 var(--f);letter-spacing:.1em;text-transform:uppercase}\n.pc{color:var(--ink);font:600 21pt/1 var(--f);display:flex;align-items:baseline;gap:2mm}\n.pc i{font:italic 400 7.6pt/1.05 var(--f);color:var(--ink);display:block;max-width:25mm}\n.mp{width:51mm;height:54mm;left:130.5mm}\n.m1{top:107.5mm}.m2{top:171.5mm}\n.mp path{stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;fill-rule:evenodd}\n.ncap{left:110mm;top:226.4mm;width:92mm;font:400 5.8pt/1.2 var(--b);color:var(--ink);opacity:.75}\n.leg{left:108mm;top:237mm;width:98mm;display:grid;grid-template-columns:1fr 1fr;gap:.9mm 3mm;font:500 7pt/1.1 var(--b)}\n.leg *{position:static}\n.leg span{display:flex;align-items:center;gap:1.6mm}\n.leg i{width:2.8mm;height:2.8mm;display:inline-block;outline:.2mm solid rgba(23,21,13,.5);outline-offset:-.2mm;flex:none}\n@page{size:A4;margin:0}\n@media print{body{background:none;padding:0}.bar{display:none}.page{box-shadow:none;margin:0;zoom:1!important}}\n<\/style>\n<div class=\"bar\"><span>Resumo A4 · versão econômica de tinta<\/span><button id=\"pr\" type=\"button\">Imprimir / salvar PDF<\/button><\/div>\n<div class=\"page\" id=\"page\">\n <svg class=\"bands\" viewBox=\"0 0 210 44\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><polygon fill=\"#f5ba1e\" points=\"60,44 140,18 210,0 210,9 150,28 100,44\"/><polygon fill=\"#8b8571\" points=\"140,38 190,22 210,16 210,21 170,34 150,40\"/><\/svg>\n <svg class=\"logo\" viewBox=\"0 0 40 40\" aria-hidden=\"true\"><circle cx=\"20\" cy=\"20\" r=\"19.3\" fill=\"none\" stroke=\"#17150d\" stroke-width=\"1.2\"/><polygon points=\"4,28 28,6 34,6 10,32\" fill=\"#f5ba1e\"/><polygon points=\"12,34 34,12 37,15 15,37\" fill=\"#fffdf4\"/><\/svg>\n <div class=\"rule\"><\/div>\n <h1 class=\"title\">Partilha<br>da <b>África<\/b><\/h1>\n <div class=\"sub\">Imperialismo · 1870–1914<\/div>\n <div class=\"pill\">Dominação europeia e resistência africana<\/div>\n\n <div class=\"hero\">\n  <div class=\"panel\"><\/div>\n  <div class=\"row r1\"><span class=\"chip\">Antes · 1880<\/span><span class=\"pc\">≈10%<i>da África sob controle europeu<\/i><\/span><\/div>\n  <svg class=\"mp m1\" id=\"m1\" viewBox=\"0 0 700 740\" role=\"img\" aria-label=\"Mapa da África em 1880\"><\/svg>\n  <div class=\"row r2\"><span class=\"chip\">Depois · 1914<\/span><span class=\"pc\">≈90%<i>da África sob controle europeu<\/i><\/span><\/div>\n  <svg class=\"mp m2\" id=\"m2\" viewBox=\"0 0 700 740\" role=\"img\" aria-label=\"Mapa da África em 1914, dividida entre as potências europeias\"><\/svg>\n  <div class=\"ncap\">Fronteiras atuais coloridas pela potência dominante em cada ano. Aproximação didática.<\/div>\n  <div class=\"leg\" id=\"leg\"><\/div>\n <\/div>\n\n <div class=\"list\">\n  <div class=\"it\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg><\/div><div><h2>1. Contexto<\/h2><p>Até 1870, os europeus controlavam cerca de 10% da África, quase só no litoral. Em 1914, eram cerca de 90%. Só a Etiópia e a Libéria seguiram independentes.<\/p><\/div><\/div>\n  <div class=\"it\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 20V10l6 4v-4l6 4V6h6v14z\"/><\/svg><\/div><div><h2>2. Causas<\/h2><p>Segunda Revolução Industrial: busca por matérias-primas (borracha, cobre, ouro, diamantes) e novos mercados. Rivalidade e nacionalismo entre as potências. Justificativa: a “missão civilizadora”, apoiada no racismo científico.<\/p><\/div><\/div>\n  <div class=\"it\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M7 3h8l4 4v14H7z\"/><path d=\"M15 3v4h4M10 12h6M10 16h6\"/><\/svg><\/div><div><h2>3. Conferência de Berlim<\/h2><p>Em 1884–1885, as potências europeias se reuniram a convite de Bismarck para estabelecer regras de ocupação e divisão dos territórios africanos, como a ocupação efetiva. Nenhum povo africano participou.<\/p><\/div><\/div>\n  <div class=\"it\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 5l6 4-3 4 8 2-3 5 10-1\"/><\/svg><\/div><div><h2>4. Consequências<\/h2><ul><li>Perda da autonomia dos povos africanos.<\/li><li>Exploração econômica e retirada de riquezas.<\/li><li>Fronteiras impostas sem respeitar culturas e etnias.<\/li><li>Violência, conflitos e resistência africana.<\/li><\/ul><\/div><\/div>\n  <div class=\"it\"><div class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z\"/><\/svg><\/div><div><h2>5. Resistência africana<\/h2><p>Adwa (1896): a Etiópia de Menelik II derrota a Itália. Isandlwana (1879): vitória zulu sobre os britânicos. Maji-Maji (1905). Genocídio herero e nama (1904–1908).<\/p><\/div><\/div>\n <\/div>\n\n <svg class=\"wave\" viewBox=\"0 0 210 50\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 14C40 2 80 4 120 10S190 14 210 4V50H0Z\" fill=\"#fdf1c8\" stroke=\"#17150d\" stroke-width=\".35\"/><\/svg>\n <div class=\"foot\"><svg class=\"lg\" viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"19\" fill=\"none\" stroke=\"#17150d\" stroke-width=\"1.2\"/><polygon points=\"6,27 27,8 32,8 11,31\" fill=\"#f5ba1e\"/><polygon points=\"13,33 32,14 35,17 16,36\" fill=\"none\" stroke=\"#17150d\" stroke-width=\".8\"/><\/svg>\n  <div class=\"a\">Conclusão<\/div><div class=\"d\"><\/div>\n  <div class=\"c\">A Partilha da África foi marcada pela <b>exploração e dominação europeia<\/b>, deixando consequências políticas, econômicas e sociais que afetaram o continente até os dias atuais.<\/div><\/div>\n <div class=\"by\"><span>Elaboração e pesquisa: Eduardo Pereira Ramos e Vitor Turbino · 8º D · Prof. Lucas<\/span><span>Desenvolvido por Waldeci Ramos<\/span><\/div>\n<\/div>\n<script>\nconst MAP={\"Tanzania\":{\"p\":\"África Oriental Alemã (Tanzânia)\",\"a\":\"N\",\"b\":\"D\",\"d\":\"M519.0 389.5L557.0 411.0L557.7 416.8L572. div><div><h2>Introdução<\/h2><ul><li>Fim do séc. XIX: potências europeias ocupam quase toda a África<\/li><li>Processo conhecido como Partilha da África<\/li><li>Em poucas décadas o mapa foi redesenhado; efeitos duram até hoje<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">2<\/div><div><h2>Do litoral ao interior<\/h2><ul><li>Até ~1870: só ≈10% sob domínio europeu, no litoral<\/li><li>1914: ≈90% dominado<\/li><li>Só Etiópia e Libéria seguem independentes<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">3<\/div><div><h2>Matéria-prima, poder e racismo<\/h2><ul><li>2ª Revolução Industrial: borracha, cobre, ouro, diamantes e mercados<\/li><li>Rivalidade e nacionalismo: colônia = poder<\/li><li>“Missão civilizadora”: racismo científico e darwinismo social<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">4<\/div><div><h2>Tecnologia e conquista<\/h2><ul><li>Quinino contra a malária abriu o interior<\/li><li>Navios a vapor, ferrovias e telégrafo<\/li><li>Metralhadora Maxim: vantagem militar europeia<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">5<\/div><div><h2>Fronteiras traçadas em Berlim<\/h2><ul><li>Conferência: nov/1884 a fev/1885, convite de Bismarck<\/li><li>Regra da ocupação efetiva<\/li><li>Nenhum africano participou; fronteiras ignoram povos e culturas<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">6<\/div><div><h2>Estado Livre do Congo<\/h2><ul><li>Leopoldo II (Bélgica): Congo como propriedade pessoal<\/li><li>Trabalho forçado na borracha, punições e mutilações<\/li><li>Denúncias levam a Bélgica a assumir o território em 1908<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">7<\/div><div><h2>Do Cairo ao Cabo<\/h2><ul><li>Grã-Bretanha: ligar o Cairo ao Cabo<\/li><li>França: unir o oeste ao leste<\/li><li>Fashoda (1898): a França recua; também Alemanha, Bélgica, Itália, Portugal e Espanha<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">8<\/div><div><h2>Povos que resistiram<\/h2><ul><li>Adwa (1896): Etiópia de Menelik II vence a Itália<\/li><li>Isandlwana (1879): zulus vencem os britânicos<\/li><li>Maji-Maji (1905); genocídio herero e nama (1904–1908)<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">9<\/div><div><h2>Marcas que permanecem<\/h2><ul><li>Fronteiras artificiais alimentam conflitos étnicos<\/li><li>Economia de exportação, trabalho forçado e monocultura<\/li><li>Independências de 1950–1970 (Gana, 1957)<\/li><\/ul><\/div><\/section><section class=\"t\"><div class=\"n\">10<\/div><div><h2>Lucro, poder e prestígio<\/h2><ul><li>Partilha feita ignorando a vontade dos africanos<\/li><li>Ajuda a entender desigualdades e conflitos atuais<\/li><li>Resistência e cultura africana permanecem vivas<\/li><\/ul><\/div><\/section><\/div>\n\n<svg class=\"wave\" viewBox=\"0 0 210 30\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M0 9C40 1 80 3 120 7S190 9 210 3V30H0Z\" fill=\"#fdf1c8\" stroke=\"#17150d\" stroke-width=\".3\"/><\/svg><div class=\"foot\"><span>Eduardo Pereira Ramos · Vitor Turbino · 8º D · Prof. Lucas<\/span><span>Desenvolvido por Waldeci Ramos<\/span><\/div>\n<\/div>\n<script>\nfunction fit(){var p=document.getElementById('page');p.style.zoom=Math.min(1,(document.documentElement.clientWidth-24)/p.offsetWidth)}fit();addEventListener('resize',fit);\ndocument.getElementById('pr').addEventListener('click',function(){try{window.print()}catch(e){}});\n<\/script>\n";

    const t=e.target.closest&&e.target.closest('path');
    if(t&&!drag){ const v=MAP[t.dataset.n], r=box.getBoundingClientRect();
      tip.innerHTML=`<b>${v.p}</b><br>1880: ${NAMES[v.a]}<br>1914: ${NAMES[v.b]}`; tip.style.display='block';
      tip.style.left=Math.min(r.width-230,e.clientX-r.left+12)+'px'; tip.style.top=Math.max(0,e.clientY-r.top-10)+'px'; }
    else tip.style.display='none';
  });
  box.addEventListener('pointerup',()=>{drag=false}); box.addEventListener('pointerleave',()=>{tip.style.display='none'});
}

/* ===== Fotos ===== */
const imgNum=(sid,k)=>{ const m=MAN.find(x=>x.slide===sid&&MAN.filter(y=>y.slide===sid).indexOf(x)===k); return m?m.n:0; };
const EXTS=['jpg','jpeg','png','webp','JPG','JPEG','PNG'];
function frameHTML(s,k,cls){
  const p=s.plates[k], key=s.id+'-'+k, has=!!userImg[key], n=imgNum(s.id,k), nn=String(n).padStart(2,'0');
  return `<div class="frame ${cls} ${has?'has user':''}" data-key="${key}" data-n="${nn}">
    <img ${has?`class="ok" src="${userImg[key]}"`:`data-i="0" alt="${p[0]}"`}>
    <span class="nb">${nn}</span>
    <button class="rm" data-rm="${key}" type="button">Remover</button>
    <div class="slot"><strong>${p[0]}</strong><span class="fname">img/${nn}.jpg</span>
      <div class="btns"><label class="chip" for="img-${key}">Adicionar foto</label><a class="chip" target="_blank" rel="noopener" href="${WS(p[1])}">Buscar ↗</a></div>
      <input class="vh" type="file" id="img-${key}" accept="image/*" data-key="${key}"></div></div>`;
}
function loadImgs(){
  document.querySelectorAll('#ex .frame').forEach(f=>{
    const im=f.querySelector('img'); if(!im||im.classList.contains('ok')) return;
    const nn=f.dataset.n; let i=0;
    const next=()=>{ if(i>=EXTS.length){ im.remove(); return; } im.src='img/'+nn+'.'+EXTS[i++]; };
    im.onload=()=>{ im.classList.add('ok'); f.classList.add('has'); };
    im.onerror=next; next();
  });
}
function renderEx(){
  const s=SLIDES[cur];
  $('ex').classList.toggle('solo',s.view==='maponly'||s.view==='thanks');
  if(s.view==='maponly'){ $('ex').innerHTML=mapHTML(); bindMap(); loadImgs(); return; }
  if(s.view==='thanks') $('ex').innerHTML=frameHTML(s,0,'big f1');
  else if(s.view==='map'){ $('ex').innerHTML=mapHTML()+frameHTML(s,0,'sm f2')+frameHTML(s,1,'sm f3'); bindMap(); }
  else $('ex').innerHTML=frameHTML(s,0,'big f1')+frameHTML(s,1,'sm f2')+frameHTML(s,2,'sm f3');
  loadImgs();
  document.querySelectorAll('#ex input[type=file]').forEach(i=>i.addEventListener('change',()=>{ if(i.files[0]) setImg(i.dataset.key,i.files[0]); }));
  document.querySelectorAll('#ex .frame').forEach(f=>{
    f.addEventListener('dragover',e=>{e.preventDefault();f.classList.add('drag')});
    f.addEventListener('dragleave',()=>f.classList.remove('drag'));
    f.addEventListener('drop',e=>{e.preventDefault();f.classList.remove('drag');const x=e.dataTransfer.files[0]; if(x&&x.type.startsWith('image/')) setImg(f.dataset.key,x)});
  });
  document.querySelectorAll('#ex .rm').forEach(b=>b.addEventListener('click',()=>{ delete userImg[b.dataset.rm]; renderEx(); paint(); }));
}
function setImg(key,file){ userImg[key]=URL.createObjectURL(file); renderEx(); paint(); }

/* ===== Créditos (bibliografia rolando como no fim de um filme) ===== */
const CREDIT_SPEED=46; /* px por segundo */
let clockT=0, rollMode=false;
function creditsHTML(){
  const refs=REFS.books.map(r=>`<li>${r}</li>`).join('');
  const webs=REFS.web.map(r=>`<li><a target="_blank" rel="noopener" href="${r[1]}">${r[0]}</a><small>${r[2]}</small></li>`).join('');
  const fi=CONFIG.fontesImagens||{}; const imgs=Object.keys(fi).map(n=>`<li><b>${String(n).padStart(2,'0')}</b>${fi[n]}</li>`).join('');
  const alunos=(CONFIG.alunos||[]).map(n=>`<li>${n}</li>`).join('');
  const extra=[CONFIG.turma?`Turma ${CONFIG.turma}`:'',CONFIG.escola||'',CONFIG.professor?`Professor: ${CONFIG.professor}`:''].filter(Boolean).map(x=>`<p>${x}</p>`).join('');
  return `<h2>Bibliografia<br>e <b>créditos</b></h2>
  <p>${CONFIG.titulo} · Imperialismo, 1870–1914</p>
  <h3>Alunos responsáveis pela elaboração</h3><ul class="alunos">${alunos}</ul>${extra}
  <h3>Origem dos textos</h3><p>Textos elaborados a partir da pesquisa nos livros e sites abaixo.</p>
  <h3>Livros</h3><ul>${refs}</ul>
  <h3>Sites consultados</h3><ul>${webs}</ul>
  <h3>Imagens</h3><p>Fotos e ilustrações de domínio público ou licença livre, pesquisadas no Wikimedia Commons.</p>${imgs?`<ul class="imgs">${imgs}</ul>`:''}
  <h3>Mapa</h3><p>Fronteiras atuais: Natural Earth (domínio público). Cores por potência dominante: aproximação didática.</p>
  <h3>Narração</h3><p>Voz gerada no ElevenLabs</p>
  <h3>Programação</h3><p><b>Desenvolvido por Waldeci Ramos</b></p>
  <p style="margin-top:60px;font-weight:300;font-size:2.4rem;text-transform:uppercase">Fim</p>`;
}
function creditsDur(){ const c=$('credits'); return ((($('roll').offsetHeight)+c.clientHeight)/CREDIT_SPEED)||60; }
function paintRoll(){
  const c=$('credits'), r=$('roll');
  if(!rollMode){ r.style.transform='none'; c.classList.add('static'); return; }
  c.classList.remove('static'); const y=c.clientHeight-clockT*CREDIT_SPEED; r.style.transform=`translateY(${y}px)`;
}

/* ===== Slide ===== */
const isCredits = s => s.view==='credits';
function renderSlide(i,animate,dir){
  $('deck').style.setProperty('--d',dir||1); window.scrollTo(0,0);
  cur=i; const s=SLIDES[i]; userWipe=null; clockT=0; rollMode=false;
  $('num').innerHTML=isCredits(s)?'Fim':String(s.id).padStart(2,'0')+'<span>/ 10</span>';
  $('kick').textContent=s.kick; $('title').innerHTML=s.title;
  $('art').innerHTML=ARTS[i%ARTS.length]; $('cnt').textContent=s.view==='maponly'?'Abertura':s.view==='thanks'?'Agradecimento':isCredits(s)?'Créditos':String(s.id).padStart(2,'0')+' / 10';
  $('slidebox').classList.toggle('intro',s.view==='maponly'||s.view==='thanks');
  $('deck').style.setProperty('--acc',ACC[i%ACC.length]);
  $('info').innerHTML=s.view==='maponly'?`<div class="is">${CONFIG.subtitulo||''}</div><div class="is">${[CONFIG.turma,CONFIG.professor?'Prof. '+CONFIG.professor:''].filter(Boolean).join(' · ')}</div>`:s.view==='thanks'?`<div class="il">Elaboração e pesquisa</div><div class="in" style="font-size:clamp(1.6rem,3.4vw,2.6rem)">${(CONFIG.alunos||[]).join('<br>')}</div><div class="ig">${CONFIG.turma}</div>${CONFIG.professor?`<div class="is">Professor: ${CONFIG.professor}</div>`:''}`:'';
  const nw=$('nextwrap'); if(isCredits(s)) nw.innerHTML=''; else { const last=s.view==='thanks', pre=s.id===10; nw.innerHTML=`<button class="nd" id="nd" type="button" aria-label="Ir para o próximo slide"><b>${last?'→':pre?'♥':s.id+1}</b><span>Próximo<small>${last?'Créditos':pre?'Agradecimento':'Slide '+(s.id+1)}</small></span></button>`; $('nd').addEventListener('click',()=>go(cur+1)); }
  $('slidebox').classList.toggle('credits-mode',isCredits(s));
  if(isCredits(s)){ $('roll').innerHTML=creditsHTML(); $('ex').innerHTML=''; } else renderEx();
  document.querySelectorAll('#segs button').forEach((b,k)=>{ b.setAttribute('aria-current',k===i); if(k!==i) b.style.setProperty('--p',k<i?'100%':'0%'); });
  const src=srcFor(s); if(src){ audio.src=src; audio.load(); } else { audio.removeAttribute('src'); audio.load(); }
  resting=true; prog=1; paint();
  const d=$('deck'); d.classList.remove('enter'); if(animate){ void d.offsetWidth; d.classList.add('enter'); }
  try{ history.replaceState(null,'','#s'+(i+1)); }catch(e){}
  fitSoon();
}
/* encaixa o slide inteiro na tela (topo e rodapé), em qualquer tamanho */
function fit(){
  const sl=$('slidebox'); if(!sl) return;
  sl.style.setProperty('--fit',1); sl.style.flex='';
  if(isCredits(SLIDES[cur])){ document.documentElement.style.overflowY=''; return; }
  sl.style.flex='none'; const h=sl.offsetHeight; sl.style.flex='';
  const avail=innerHeight-28; let s=1;
  if(h>avail) s=Math.max(.6,avail/h);
  sl.style.setProperty('--fit',s.toFixed(4));
  document.documentElement.style.overflowY=(s*h<=avail+1)?'hidden':'';
  document.body.style.overflowY=(s*h<=avail+1)?'hidden':'';
  window.scrollTo(0,0);
}
let fitT=0; function fitSoon(){ cancelAnimationFrame(fitT); fitT=requestAnimationFrame(()=>{ fit(); setTimeout(fit,250); }); }
addEventListener('resize',fitSoon); addEventListener('orientationchange',fitSoon); addEventListener('load',fitSoon);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSoon);
function durNow(){ const s=SLIDES[cur]; if(isCredits(s)) return creditsDur(); return audio.duration>0?audio.duration:0; }
function timeNow(){ return isCredits(SLIDES[cur])?clockT:(audio.currentTime||0); }
function paint(){
  const s=SLIDES[cur], len=s.text.length;
  if(s.view==='maponly'){
    const d=audio.duration||1; prog=resting?1:Math.min(1,(audio.currentTime||0)/d);
    if(userWipe!==null) setWipe(userWipe); else if(resting) setWipe(50); else setWipe(100*Math.min(1,Math.max(0,(prog-s.wipe[0])/(s.wipe[1]-s.wipe[0]))));
    setLit(resting?null:litAt(audio.currentTime||0));
  } else if(s.view==='thanks'){
    prog=resting?1:Math.min(1,(audio.currentTime||0)/(audio.duration||1));
  } else if(isCredits(s)){
    paintRoll(); prog=resting?1:Math.min(1,clockT/creditsDur());
  } else {
    const idx = resting?len:Math.min(len,idxFromTime(s,audio.currentTime||0));
    prog = resting?1:idx/len;
    $('shown').textContent=s.text.slice(0,idx); $('rest').textContent=s.text.slice(idx);
    if(playing&&!resting&&window.innerWidth<=900){ const r=$('type').getBoundingClientRect(); const cr=$('shown').getBoundingClientRect(); const bottom=cr.bottom>r.top?cr.bottom:r.top; if(bottom>innerHeight-110) window.scrollBy({top:bottom-innerHeight+170,behavior:'smooth'}); }
    $('deck').classList.toggle('done',resting||idx>=len);
    if(s.view==='map'){
      if(userWipe!==null) setWipe(userWipe);
      else if(resting) setWipe(50);
      else setWipe(100*Math.min(1,Math.max(0,(prog-s.wipe[0])/(s.wipe[1]-s.wipe[0]))));
    }
  }
  const b=document.querySelectorAll('#segs button')[cur]; if(b) b.style.setProperty('--p',(resting?100:prog*100)+'%');
  $('thinfill').style.width=((cur+(resting?1:prog))/SLIDES.length*100)+'%';
  const d=durNow(), t=timeNow();
  $('tcur').textContent=fmt(t); $('tdur').textContent=fmt(d);
  const v=d?Math.min(1000,t/d*1000):0; $('seek').value=v; $('seek').style.setProperty('--p',(v/10)+'%');
}

/* ===== Reprodução ===== */
function tick(now){
  if(!playing) return;
  const s=SLIDES[cur];
  if(isCredits(s)){ clockT+=(now-last)/1000; last=now; paint(); if(clockT>=creditsDur()) return finish(); }
  else { paint(); if(audio.ended) return finish(); }
  raf=requestAnimationFrame(tick);
}
function finish(){
  resting=false; paint();
  const credits=isCredits(SLIDES[cur]);
  setTimeout(()=>{ if(!playing) return; if(cur<SLIDES.length-1) go(cur+1,true); else pause(true); },credits?600:250);
}
function play(){
  const s=SLIDES[cur];
  if(isCredits(s)){ if(resting||clockT>=creditsDur()){ clockT=0; } rollMode=true; resting=false; }
  else if(resting||audio.ended){ audio.currentTime=0; resting=false; userWipe=null; }
  playing=true; setIco(true); last=performance.now();
  if(!isCredits(s)){ const p=audio.play(); if(p&&p.catch) p.catch(()=>{ playing=false; setIco(false); }); }
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function pause(end){ playing=false; setIco(false); audio.pause(); cancelAnimationFrame(raf); if(end){ resting=true; rollMode=false; paint(); } }
let goT=0;
function go(i,keep){
  i=Math.max(0,Math.min(SLIDES.length-1,i)); const was=keep||playing; playing=false; audio.pause(); cancelAnimationFrame(raf); setIco(false);
  const dir=i>=cur?1:-1, d=$('deck'); d.style.setProperty('--d',dir); d.classList.add('leave');
  clearTimeout(goT); goT=setTimeout(()=>{ d.classList.remove('leave'); renderSlide(i,true,dir); if(was) setTimeout(play,160); },300);
}
function setIco(p){ $('ico').innerHTML=p?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4.5v15l13-7.5z"/>'; $('play').setAttribute('aria-label',p?'Pausar':'Ouvir e digitar'); }

audio.addEventListener('loadedmetadata',paint);
$('play').addEventListener('click',()=>playing?pause():play());
$('prev').addEventListener('click',()=>go(cur-1));
$('next').addEventListener('click',()=>go(cur+1));
$('seek').addEventListener('input',e=>{ const s=SLIDES[cur], d=durNow(); resting=false; userWipe=null; if(isCredits(s)){ rollMode=true; clockT=e.target.value/1000*d; } else audio.currentTime=e.target.value/1000*d; paint(); });
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; userAudio[SLIDES[cur].id]=URL.createObjectURL(f); const i=cur; pause(); renderSlide(i,false); e.target.value=''; });
let resKind='res';
const DOCS=()=>({res:['Resumo para impressão',RESUMO_HTML],top:['Tópicos para impressão',TOPICOS_HTML]});
function openRes(k){ k=k||'res'; if(playing) pause(); const f=$('mframe'); if(resKind!==k||!f.srcdoc){ resKind=k; f.srcdoc=DOCS()[k][1]; } $('mtitle').textContent=DOCS()[k][0]; $('modal').hidden=false; $('mclose').focus(); }
function closeRes(){ $('modal').hidden=true; }
function printRes(k){
  k=(typeof k==='string')?k:resKind; const f=$('mframe'); if(playing) pause();
  const go_=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.print(); } };
  if(resKind!==k||!f.srcdoc){ resKind=k; $('mtitle').textContent=DOCS()[k][0]; f.addEventListener('load',()=>setTimeout(go_,600),{once:true}); f.srcdoc=DOCS()[k][1]; $('modal').hidden=false; } else { $('modal').hidden=false; go_(); }
}
$('mprint').addEventListener('click',()=>printRes());
$('resbtn').addEventListener('click',()=>openRes('res')); $('topbtn').addEventListener('click',()=>openRes('top')); $('prbtn').addEventListener('click',()=>printRes('res')); $('prtbtn').addEventListener('click',()=>printRes('top')); $('mclose').addEventListener('click',closeRes);
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeRes(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('modal').hidden) closeRes(); });
const dock=$('dock'), pop=$('pop'), launch=$('launch');
function openDock(){ dock.classList.remove('hide'); launch.hidden=true; }
function closeDock(){ dock.classList.add('hide'); launch.hidden=false; pop.hidden=true; $('dots').setAttribute('aria-expanded','false'); }
launch.addEventListener('click',openDock); $('minim').addEventListener('click',closeDock);
document.addEventListener('pointerdown',e=>{ if(!pop.hidden&&!e.target.closest('.menu')){ pop.hidden=true; $('dots').setAttribute('aria-expanded','false'); } });
$('dots').addEventListener('click',()=>{ pop.hidden=!pop.hidden; $('dots').setAttribute('aria-expanded',String(!pop.hidden)); });
pop.addEventListener('click',e=>{ if(e.target.closest('button,a')) pop.hidden=true; });
if(!HAS_IMGPAGE) $('imglink').remove();
/* arrastar o painel */
(function(){ const g=$('grip'); let ox=0,oy=0,on=false;
  g.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; const r=dock.getBoundingClientRect(); on=true; ox=e.clientX-r.left; oy=e.clientY-r.top; dock.style.left=r.left+'px'; dock.style.top=r.top+'px'; dock.style.bottom='auto'; dock.style.transform='none'; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove',e=>{ if(!on) return; const w=dock.offsetWidth,h=dock.offsetHeight; dock.style.left=Math.min(innerWidth-w,Math.max(0,e.clientX-ox))+'px'; dock.style.top=Math.min(innerHeight-h,Math.max(0,e.clientY-oy))+'px'; });
  g.addEventListener('pointerup',()=>{ on=false; }); g.addEventListener('pointercancel',()=>{ on=false; });
})();
$('nums').addEventListener('click',()=>document.body.classList.toggle('nonum'));
$('fs').addEventListener('click',()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} });
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName, isRange=document.activeElement.type==='range';
  if(e.code==='Space'&&tag!=='BUTTON'&&tag!=='INPUT'){ e.preventDefault(); playing?pause():play(); }
  if(e.code==='ArrowRight'&&!isRange) go(cur+1);
  if(e.code==='ArrowLeft'&&!isRange) go(cur-1);
});
$('segs').innerHTML=SLIDES.map((s,i)=>`<button data-i="${i}" title="${String(i+1).padStart(2,'0')} · ${s.kick}" aria-label="Slide ${i+1}: ${s.kick}"><i></i></button>`).join('');
$('segs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.i); });
window.addEventListener('hashchange',()=>{ const m=/^#s(\d+)$/.exec(location.hash); if(m&&+m[1]-1!==cur) go(+m[1]-1); });
const m0=/^#s(\d+)$/.exec(location.hash);
renderSlide(m0?Math.min(SLIDES.length,Math.max(1,+m0[1]))-1:0,true);
</script>
