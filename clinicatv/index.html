<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica TV</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="assets/fx.css">
<style>
  :root { --p:#1fb6a6; --s:#d4a93c; --bg:#eef4f5; --panel:#ffffff; --card:#f1f7f8; --txt:#0f2a33; --mut:#5d7680; --line:#d8e5e8; --lt:#ffffff; --ltTxt:#0b1d2e; --crawl:#e3f0f1; --crawlTxt:#16363f; --shadow:0 .4rem 1.4rem rgba(15,42,51,.13); --fd:'Qurova'; --fb:'Agency'; --brandBg:#fff; --brandFg:#0b1d2e; --sw:30rem; --mx:0vw; --my:0vh; }
  body.dark { --bg:#06111d; --panel:#0b2033; --card:rgba(255,255,255,.06); --txt:#eaf2f8; --mut:#9bb0c3; --line:rgba(255,255,255,.1); --crawl:#0b1d2e; --crawlTxt:#e9f1f8; --shadow:0 .4rem 1.4rem rgba(0,0,0,.45); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  body.show-ui { cursor: default; }
  body { font-family: var(--fb), 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--txt); font-size: 1rem; }

  #app { position: fixed; left: var(--mx); top: var(--my); width: calc(100vw - 2 * var(--mx)); height: calc(100vh - 2 * var(--my)); background: var(--bg); display: grid; overflow: hidden; }
  #app.rot90  { left: 0; top: 0; width: calc(100vh - 2 * var(--my)); height: calc(100vw - 2 * var(--mx)); transform-origin: 0 0; transform: translate(calc(100vw - var(--mx)), var(--my)) rotate(90deg); }
  #app.rot270 { left: 0; top: 0; width: calc(100vh - 2 * var(--my)); height: calc(100vw - 2 * var(--mx)); transform-origin: 0 0; transform: translate(var(--mx), calc(100vh - var(--my))) rotate(-90deg); }

  /* ===== Horizontal ===== */
  #app.h { grid-template-columns: var(--sw) 1fr; grid-template-rows: 1fr auto auto; grid-template-areas: "side stage" "side svc" "side lt"; }
  body.no-side #app.h { grid-template-columns: 0 1fr; } body.no-side #side { display: none; }
  #side { grid-area: side; display: flex; flex-direction: column; gap: .85rem; padding: 1.2rem 1.2rem .8rem; background: var(--panel); border-right: .1rem solid var(--line); box-shadow: var(--shadow); min-height: 0; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 1rem; min-height: 5rem; padding: .7rem 1rem; border-radius: 1.1rem; background: var(--brandBg); color: var(--brandFg); border: .08rem solid var(--line); }
  .brand img { max-height: 4rem; max-width: 7rem; object-fit: contain; }
  .brand .t1 { font-family: var(--fd); font-size: 1.6rem; font-weight: 700; line-height: 1.05; }
  .brand .t2 { font-size: 1.05rem; opacity: .7; margin-top: .2rem; }
  .clock { text-align: center; }
  .clock .time { font-family: var(--fd); font-size: 6.6rem; font-weight: 700; letter-spacing: -.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock .sec { font-family: var(--fd); font-size: 2rem; font-weight: 700; color: var(--p); margin-left: .3rem; vertical-align: top; }
  .clock .date { font-size: 1.55rem; font-weight: 700; color: var(--txt); margin-top: .4rem; letter-spacing: .02rem; }
  .card { background: var(--card); border: .08rem solid var(--line); border-radius: 1.1rem; padding: .8rem 1rem; }
  .weather .wtop { display: flex; align-items: center; gap: .9rem; }
  .weather .ico { font-size: 3.2rem; line-height: 1; }
  .weather .temp { font-family: var(--fd); font-size: 2.7rem; font-weight: 700; line-height: 1; }
  .weather .desc { font-size: 1rem; color: var(--mut); margin-top: .2rem; }
  .weather .minmax { margin-left: auto; text-align: right; font-size: 1rem; color: var(--mut); line-height: 1.5; }
  .weather .city { font-size: .8rem; text-transform: uppercase; letter-spacing: .08rem; color: var(--p); font-weight: 700; }
  .wstats { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .8rem; margin-top: .6rem; font-size: .95rem; color: var(--mut); } .wstats b { color: var(--txt); }
  .wdays { display: flex; margin-top: .7rem; padding-top: .6rem; border-top: .06rem solid var(--line); text-align: center; }
  .wdays div { flex: 1; display: flex; flex-direction: column; gap: .12rem; font-size: .95rem; }
  .wdays b { color: var(--p); font-size: .78rem; text-transform: uppercase; letter-spacing: .04rem; } .wdays span { font-size: 1.45rem; } .wdays i { font-style: normal; font-weight: 700; } .wdays u { text-decoration: none; color: var(--mut); }
  .wupd { font-size: .7rem; color: var(--mut); margin-top: .4rem; text-align: right; }
  .sched { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .h2 { font-size: .8rem; font-weight: 700; color: var(--p); letter-spacing: .15rem; text-transform: uppercase; margin-bottom: .45rem; }
  #schedList { flex: 1; overflow: hidden; position: relative; }
  .row { display: flex; gap: .8rem; padding: .36rem 0; border-bottom: .06rem solid var(--line); font-size: 1.1rem; line-height: 1.25; }
  .row b { color: var(--p); min-width: 3.8rem; font-variant-numeric: tabular-nums; }
  .row.past { opacity: .4; }
  .row.now { background: color-mix(in srgb, var(--p) 18%, transparent); margin: 0 -.5rem; padding-left: .5rem; padding-right: .5rem; border-radius: .5rem; font-weight: 700; }
  .row.now b { color: var(--s); }
  .empty { color: var(--mut); font-size: 1rem; padding: .6rem 0; }
  .verse { background: color-mix(in srgb, var(--s) 14%, var(--panel)); border-color: color-mix(in srgb, var(--s) 40%, transparent); min-height: 10.5rem; display: flex; flex-direction: column; justify-content: center; transition: opacity .6s; }
  .verse .vt { font-size: 1.2rem; line-height: 1.4; font-weight: 500; font-style: italic; }
  .verse .vr { margin-top: .5rem; color: var(--s); font-weight: 700; font-size: 1rem; } .verse .h2 { color: var(--s); }
  .credit { font-size: .75rem; color: var(--mut); text-align: center; opacity: .8; }
  #logoCard { display: flex; align-items: center; justify-content: center; min-height: 6rem; padding: .6rem; background: var(--brandBg); }
  #logoCard img { max-height: 5rem; max-width: 100%; object-fit: contain; }

  /* ===== Palco com moldura ===== */
  #stage { grid-area: stage; position: relative; min-height: 0; padding: 1.4rem 1.4rem .8rem; }
  #frame { position: absolute; inset: 1.4rem 1.4rem .8rem; border-radius: 1.8rem; overflow: hidden; background: #000; box-shadow: 0 0 0 .3rem #fff, 0 0 0 .5rem var(--p), var(--shadow); }
  #app.fullbleed #stage { padding: 0; } #app.fullbleed #frame { inset: 0; border-radius: 0; box-shadow: none; }
  .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), filter 1s ease, clip-path 1.1s cubic-bezier(.7,0,.2,1), visibility 0s 1s; }
  .slide.on { opacity: 1; visibility: visible; transform: none; filter: none; clip-path: inset(0); transition-delay: 0s; }
  .tr-slide { transform: translateX(14%); } .tr-zoom { transform: scale(1.2); } .tr-flip { transform: perspective(90rem) rotateY(75deg); } .tr-blur { filter: blur(1.4rem); transform: scale(1.06); } .tr-wipe { clip-path: inset(0 100% 0 0); }
  .slide .img { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: cover; }
  .slide .img.contain { background-size: contain; }
  .slide .bgb { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(2.2rem) brightness(.55); }
  .slide video, .slide iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; background: #000; }
  .slide video::-webkit-media-controls { display: none !important; }
  .slide video::-webkit-media-controls-panel { display: none !important; }
  .slide.on.kb-in .img { animation: kbin var(--dur,14s) ease-out both; } .slide.on.kb-out .img { animation: kbout var(--dur,14s) ease-out both; } .slide.on.kb-pan .img { animation: kbpan var(--dur,14s) ease-in-out both; }
  @keyframes kbin { from { transform: scale(1); } to { transform: scale(1.14); } } @keyframes kbout { from { transform: scale(1.14); } to { transform: scale(1); } } @keyframes kbpan { from { transform: scale(1.12) translateX(-3%); } to { transform: scale(1.12) translateX(3%); } }
  .slide.text { flex-direction: column; padding: 4rem; }
  .slide.text::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 82% 18%, rgba(255,255,255,.14), transparent 45%); pointer-events: none; }
  .slide .ic { font-size: 8rem; line-height: 1; margin-bottom: 1.4rem; position: relative; z-index: 1; }
  .slide .tx { position: relative; z-index: 2; max-width: 100%; } .slide .tx2 { margin-top: 1.2rem; max-width: 56rem; }
  .ov { position: absolute; left: 0; right: 0; z-index: 3; padding: 2.4rem 3rem; display: flex; flex-direction: column; gap: .8rem; text-align: left; }
  .ov.pos-bottom { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,.78), transparent); padding-top: 6rem; }
  .ov.pos-top { top: 0; background: linear-gradient(180deg, rgba(0,0,0,.78), transparent); padding-bottom: 6rem; }
  .ov.pos-center { top: 0; bottom: 0; justify-content: center; align-items: center; text-align: center; background: rgba(0,0,0,.35); }
  .slide.niv { background: radial-gradient(circle at 30% 40%, var(--b1), var(--b2) 72%); gap: 5rem; padding: 3rem 5rem; }
  .niv .pol { position: relative; z-index: 2; width: 24rem; aspect-ratio: 3/4; max-height: 80%; background: #fff; border-radius: 2rem; box-shadow: 0 1.2rem 3rem rgba(0,0,0,.5); transform: rotate(-3deg); animation: pol 6s ease-in-out infinite alternate; }
  .niv .pol .img, .niv .pol video { inset: .9rem; width: calc(100% - 1.8rem); height: calc(100% - 1.8rem); border-radius: 1.3rem; }
  @keyframes pol { to { transform: rotate(3deg) scale(1.03); } }
  .niv .who { position: relative; z-index: 2; max-width: 44rem; text-align: left; } .niv .who .pre { font-family: var(--fd); font-size: 2.2rem; color: #fff; opacity: .9; } .niv .who .tx2 { margin-top: 1rem; }
  .slide.dc { display: grid; grid-template-columns: 1.8fr 1fr; text-align: left; background: linear-gradient(160deg, var(--b1), var(--b2)); }
  .dc .ph { position: relative; overflow: hidden; } .dc .pn { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; padding: 3rem; }
  .bgfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; } .bgfx i { position: absolute; display: block; }
  .bgfx-aurora i { width: 60%; height: 60%; border-radius: 50%; filter: blur(5rem); opacity: .5; animation: aur 14s ease-in-out infinite alternate; }
  .bgfx-aurora i:nth-child(1) { background: #5eead4; left: -10%; top: -10%; } .bgfx-aurora i:nth-child(2) { background: #a78bfa; right: -15%; top: 20%; animation-duration: 19s; } .bgfx-aurora i:nth-child(3) { background: #38bdf8; left: 20%; bottom: -25%; animation-duration: 23s; }
  @keyframes aur { to { transform: translate(18%, 12%) scale(1.25); } }
  .bgfx-bolhas i { bottom: -10%; border-radius: 50%; border: .15rem solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); animation: rise linear infinite; } @keyframes rise { to { transform: translateY(-140rem); } }
  .bgfx-confete i { top: -8%; width: .8rem; height: 1.4rem; animation: fall linear infinite; } @keyframes fall { to { transform: translateY(140rem) rotate(720deg); } }
  .bgfx-brilhos i { border-radius: 50%; background: #fff; box-shadow: 0 0 .8rem #fff; animation: tw ease-in-out infinite; } @keyframes tw { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
  .bgfx-ondas svg { position: absolute; left: 0; width: 200%; animation: wave 14s linear infinite; } .bgfx-ondas svg path { fill: rgba(255,255,255,.14); }
  .bgfx-ondas svg:nth-child(1) { bottom: 0; height: 34%; } .bgfx-ondas svg:nth-child(2) { bottom: 0; height: 26%; animation-duration: 22s; animation-direction: reverse; } @keyframes wave { to { transform: translateX(-50%); } }

  /* Rádio */
  #radio { position: absolute; top: 2.4rem; right: 2.6rem; z-index: 30; display: flex; align-items: center; gap: .8rem; padding: .55rem 1.1rem .55rem .7rem; max-width: 34rem; background: rgba(6,17,29,.82); color: #eaf2f8; border: .08rem solid rgba(255,255,255,.2); border-radius: 99rem; backdrop-filter: blur(.4rem); cursor: pointer; }
  #radio[hidden] { display: none; }
  #radio .rb { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--p); display: grid; place-items: center; font-size: 1.15rem; color: #fff; flex: none; }
  #radio .rn { font-size: .78rem; font-weight: 700; letter-spacing: .06rem; text-transform: uppercase; color: var(--p); }
  #radio .rt { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24rem; }
  #radio .eq { display: flex; gap: .15rem; align-items: flex-end; height: 1.3rem; } #radio .eq i { width: .22rem; background: var(--p); height: 25%; border-radius: .1rem; transition: height .15s; }
  #radio.on .eq i { animation: eq 1s ease-in-out infinite; }
  #radio.on .eq i:nth-child(1) { animation-delay: 0s; } #radio.on .eq i:nth-child(2) { animation-delay: .15s; } #radio.on .eq i:nth-child(3) { animation-delay: .3s; } #radio.on .eq i:nth-child(4) { animation-delay: .45s; }
  #radio.hint { animation: hint 1.4s ease-in-out infinite; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } } @keyframes hint { 50% { box-shadow: 0 0 0 .6rem color-mix(in srgb, var(--p) 40%, transparent); } }

  /* ===== Faixa de serviços ===== */
  #svc { grid-area: svc; display: flex; gap: .8rem; padding: .3rem 1.4rem .7rem; overflow: hidden; flex-wrap: nowrap; }
  #svc .sc { display: flex; align-items: center; gap: .55rem; padding: .5rem 1.1rem; border-radius: 99rem; background: var(--panel); border: .08rem solid var(--line); font-size: 1.15rem; font-weight: 600; white-space: nowrap; transition: .5s; }
  #svc .sc span { font-size: 1.3rem; } #svc .sc.hl { background: var(--p); color: #fff; border-color: var(--p); transform: translateY(-.12rem); box-shadow: 0 .3rem .9rem color-mix(in srgb, var(--p) 45%, transparent); }

  /* ===== Barra de notícias (Estilo Telejornal Moderno) ===== */
  #lt { grid-area: lt; margin: .1rem 1.4rem 1.2rem; background: #0f172a; border-radius: 1.2rem; overflow: hidden; box-shadow: 0 .6rem 2rem rgba(0,0,0,.35); display: flex; flex-direction: column; min-width: 0; border: 1px solid rgba(255,255,255,.08); }
  .lt-head { display: flex; align-items: stretch; min-height: 7.2rem; min-width: 0; }
  .lt-date { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 9rem; padding: 0 1.4rem; background: linear-gradient(180deg, #1e3a8a, #0f172a); color: #fff; line-height: 1.05; border-right: 1px solid rgba(255,255,255,.1); }
  .lt-date b { font-family: var(--fd); font-size: 3rem; font-weight: 800; text-shadow: 0 .2rem .4rem rgba(0,0,0,.5); } .lt-date small { font-size: 1rem; letter-spacing: .15rem; opacity: .9; font-weight: 600; margin-top: .2rem; } .lt-date em { font-style: normal; font-size: 1.2rem; margin-top: .4rem; color: #fbbf24; font-variant-numeric: tabular-nums; font-weight: 700; }
  .lt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: .4rem; padding: .8rem 1.8rem; }
  .lt-badge { align-self: flex-start; padding: .2rem 1.2rem; background: var(--p); color: #fff; font-weight: 800; font-size: .85rem; letter-spacing: .08rem; text-transform: uppercase; border-radius: .4rem; white-space: nowrap; box-shadow: 0 .2rem .4rem rgba(0,0,0,.3); }
  .lt-text { font-family: var(--fd); font-size: 2.2rem; font-weight: 800; line-height: 1.15; color: #f8fafc; max-height: 2.35em; overflow: hidden; text-shadow: 0 .1rem .2rem rgba(0,0,0,.5); }
  .lt-detail { font-size: 1.15rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-crawl { position: relative; height: 3.2rem; overflow: hidden; display: flex; align-items: center; background: #1e293b; border-top: 1px solid rgba(255,255,255,.08); color: #cbd5e1; }
  #tScroll { position: absolute; left: 0; white-space: nowrap; font-size: 1.2rem; font-weight: 500; will-change: transform; } #tScroll em { font-style: normal; font-weight: 800; margin-right: .4rem; color: #fbbf24; } #tScroll i { font-style: normal; color: var(--p); margin: 0 1.6rem; }

  /* ===== Vertical ===== */
  #app.v { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto auto auto; grid-template-areas: "brand brand" "clock weather" "stage stage" "sched verse" "svc svc" "lt lt"; }
  #app.v #side { display: contents; }
  #app.v .brand { grid-area: brand; border-radius: 0; border: 0; border-bottom: .08rem solid var(--line); padding: 1rem 1.8rem; }
  #app.v .clock { grid-area: clock; background: var(--panel); padding: 1rem; display: flex; flex-direction: column; justify-content: center; } #app.v .clock .time { font-size: 5.4rem; }
  #app.v .weather { grid-area: weather; border-radius: 0; background: var(--panel); border: 0; border-left: .08rem solid var(--line); }
  #app.v .sched { grid-area: sched; border-radius: 0; max-height: 24rem; background: var(--panel); border: 0; border-top: .08rem solid var(--line); }
  #app.v .verse { grid-area: verse; border-radius: 0; min-height: 0; border: 0; } #app.v .credit { display: none; }
  #app.v #stage { grid-area: stage; } #app.v #svc { grid-area: svc; } #app.v #lt { grid-area: lt; margin-bottom: 1rem; }
  #app.v .slide .ic { font-size: 7rem; } #app.v .slide.niv { flex-direction: column; gap: 2rem; } #app.v .slide.dc { grid-template-columns: 1fr; grid-template-rows: 1.4fr 1fr; }
  body.compact #app.v { grid-template-areas: "brand brand" "clock weather" "stage stage" "lt lt"; }
  body.compact #app.v .sched, body.compact #app.v .verse, body.compact #svc { display: none; }
  body.no-brand .brand, body.no-weather .weather, body.no-schedule .sched, body.no-verse .verse, body.no-services #svc, body.no-ticker #lt { display: none !important; }
  
  /* MODO PLANTÃO (SÓ YOUTUBE) */
  body.live-mode #side, body.live-mode #svc, body.live-mode #lt { display: none !important; }
  body.live-mode #app { grid-template-columns: 1fr; grid-template-areas: "stage"; }
  body.live-mode #frame { inset: 0; border-radius: 0; box-shadow: none; }
  body.live-mode #stage { padding: 0; }

  #bar { position: fixed; right: 1rem; bottom: 1rem; z-index: 99; display: flex; gap: .5rem; opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.show-ui #bar { opacity: 1; pointer-events: auto; } body.preview #bar { display: none; }
  #bar button, #bar a { font: 600 14px system-ui, sans-serif; background: rgba(0,0,0,.8); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 10px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; }
  #bar button:hover, #bar a:hover { background: var(--p); }
</style>
</head>
<body>
<div id="app" class="h">
  <aside id="side">
    <div class="brand"><img id="logo" alt="" hidden><div><div class="t1" id="name"></div><div class="t2" id="subtitle"></div></div></div>
    <div class="clock"><div><span class="time" id="time">--:--</span><span class="sec" id="sec"></span></div><div class="date" id="date"></div></div>
    <div class="card weather" id="weather">
      <div class="wtop"><div class="ico" id="wIco">⛅</div><div><div class="temp" id="wTemp">--°</div><div class="desc" id="wDesc">Carregando…</div></div><div class="minmax"><div class="city" id="wCity"></div><div id="wMm"></div></div></div>
      <div class="wstats"><span>💧 Umidade <b id="wHum">--</b></span><span>💨 Vento <b id="wWind">--</b></span><span>🌡 Sensação <b id="wFeel">--</b></span><span>☔ Chuva <b id="wRain">--</b></span></div>
      <div class="wdays" id="wDays"></div>
      <div class="wupd" id="wUpd"></div>
    </div>
    <div class="card brand" id="logoCard" style="justify-content:center;padding:.6rem;display:none">
      <img id="logo2" alt="Logo da clínica" style="max-height:5rem;max-width:100%;object-fit:contain">
    </div>
    <div class="card sched"><div class="h2" id="schedTitle">Programação de hoje</div><div id="schedList"></div></div>
    <div class="card verse" id="verse"><div class="h2">✝ Palavra de Deus</div><div class="vt" id="vText"></div><div class="vr" id="vRef"></div></div>
    <div class="credit">Clínica TV · idealizado por Waldeci Ramos</div>
  </aside>
  <main id="stage">
    <div id="frame"></div>
    <div id="radio" hidden><div class="rb" id="rBtn">▶</div><div style="min-width:0"><div class="rn" id="rName">Rádio</div><div class="rt" id="rTitle"></div></div><div class="eq"><i></i><i></i><i></i><i></i></div></div>
  </main>
  <div id="svc"></div>
  <footer id="lt">
    <div class="lt-head">
      <div class="lt-date"><b id="ltDay"></b><small id="ltMon"></small><em id="ltHr"></em></div>
      <div class="lt-main"><div class="lt-badge" id="ltBadge"></div><div class="lt-text" id="ltText"></div><div class="lt-detail" id="ltDetail"></div></div>
    </div>
    <div class="lt-crawl"><div id="tScroll"></div></div>
  </footer>
</div>
<div id="bar"><button id="bFull">⛶ Tela cheia (F)</button><button id="bRot">⟳ Girar (R)</button><button id="bMute">📻 Rádio (M)</button><a href="admin.html">⚙ Admin</a></div>

<script src="assets/core.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const app = $('app');

  $('radio').addEventListener('click', (e) => { e.stopPropagation(); rToggle(); });
  ['click', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, () => { if (cfg && cfg.radio.enabled && cfg.radio.autoplay && rWant && audio.paused) rPlay(); }, { passive: true }));

  function fullscreen() {
    const d = document.documentElement;
    if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch(() => {}); else document.exitFullscreen();
  }
  function rotate() {
    const order = ['h', 'v', 'v90', 'v270'], cur = orient(), nx = order[(order.indexOf(cur) + 1) % order.length];
    InfoTV.setOrient(nx === (cfg.general.orientation || 'h') ? '' : nx);
    if (Q.get('o')) { const u = new URL(location.href); u.searchParams.set('o', nx); location.href = u; return; }
    layout(); lowerThird(); renderSchedule();
  }
  $('bFull').onclick = fullscreen; $('bRot').onclick = rotate; $('bMute').onclick = rToggle;
  addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'f') fullscreen(); if (k === 'r') rotate(); if (k === 'm') rToggle(); if (k === 'n' && cfg.radio.stations.length > 1) { rSet((rIdx + 1) % cfg.radio.stations.length); rPlay(); } });
  let uiT; addEventListener('mousemove', () => { document.body.classList.add('show-ui'); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove('show-ui'), 3000); });
  async function wake() { try { if (!PREVIEW && 'wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

  let customFontEl = null;
  function apply() {
    const g = cfg.general, root = document.documentElement.style;
    root.setProperty('--p', g.primary || '#1fb6a6'); root.setProperty('--s', g.secondary || '#d4a93c');
    root.setProperty('--brandBg', g.brandBg || '#fff'); root.setProperty('--brandFg', g.brandFg || '#0b1d2e');
    if (!customFontEl) { customFontEl = document.createElement('style'); document.head.appendChild(customFontEl); }
    customFontEl.textContent = g.fontCustomSrc ? "@font-face{font-family:'InfoCustom';src:url('" + g.fontCustomSrc + "');font-display:swap}" : '';
    const fd = g.fontCustomSrc ? 'InfoCustom' : g.fontDisplay;
    root.setProperty('--fd', "'" + fd + "', 'Comfortaa', sans-serif"); root.setProperty('--fb', "'" + (g.fontBody || 'Agency') + "', 'Montserrat', sans-serif");
    $('name').textContent = g.name; $('subtitle').textContent = g.subtitle || '';
    document.title = 'Clínica TV · ' + g.name;
    const lg = $('logo'); if (g.logo) { lg.src = g.logo; lg.hidden = false; } else lg.hidden = true;
    const l2 = $('logo2'); const l2c = $('logoCard');
    if (g.logo) { l2.src = g.logo; l2c.style.display = 'flex'; } else { l2c.style.display = 'none'; }
    const ck = Object.assign({}, InfoTV.DEFAULT.general.clock, g.clock); ck.anim = 'none';
    if (g.theme === 'escuro' && ck.color === '#0f766e') { ck.color = '#a8f0e7'; ck.g1 = '#ffffff'; }
    InfoFX.style($('time'), ck, 0); $('time').className += ' time'; $('time').style.fontSize = '';
    layout(); renderSchedule(); nextVerse(); weather(); lowerThird(); services(); radioApply();
    sIdx = -1; nextSlide();
  }

  async function init() {
    cfg = await InfoTV.load();
    apply(); tick(); setInterval(tick, 1000); wake();
    let ct; InfoTV.onChange(() => { clearTimeout(ct); ct = setTimeout(async () => { cfg = await InfoTV.load(); apply(); }, 1200); });
    setInterval(async () => {
      if (InfoTV.getMode() !== 'repo' || await InfoTV.isServer()) return;
      const n = await InfoTV.loadRepo();
      if (n && JSON.stringify(n) !== JSON.stringify(cfg)) { cfg = n; apply(); }
    }, 120000);
    if (!PREVIEW) setTimeout(() => location.reload(), 24 * 3600 * 1000);
  }
  init();
})();
</script>
</body>
</html>
