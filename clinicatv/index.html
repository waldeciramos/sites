<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="9.3">
<title>Clínica TV</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="assets/fx.css">
<style>
  :root { --p:#1fb6a6; --s:#d4a93c; --bg:#eef4f5; --panel:#ffffff; --card:#f1f7f8; --txt:#0f2a33; --mut:#5d7680; --line:#d8e5e8; --lt:#ffffff; --ltTxt:#0b1d2e; --crawl:#e3f0f1; --crawlTxt:#16363f; --shadow:0 .4rem 1.4rem rgba(15,42,51,.13); --fd:'Qurova'; --fb:'Agency'; --brandBg:#fff; --brandFg:#0b1d2e; --sw:30rem; --mx:0vw; --my:0vh; }
  body.dark { --bg:#06111d; --panel:#0b2033; --card:rgba(255,255,255,.06); --txt:#eaf2f8; --mut:#9bb0c3; --line:rgba(255,255,255,.1); --crawl:#0b1d2e; --crawlTxt:#e9f1f8; --shadow:0 .4rem 1.4rem rgba(0,0,0,.45); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  body.show-ui { cursor: default; }
  body { font-family: var(--fb), 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--txt); font-size: 1rem; }

  #app { position: fixed; left: var(--mx); top: var(--my); width: calc(100vw - 2 * var(--mx)); height: calc(100vh - 2 * var(--my)); background: var(--bg); display: grid; overflow: hidden; }
  #app.rot90  { left: 0; top: 0; width: calc(100vh - 2 * var(--my)); height: calc(100vw - 2 * var(--mx)); transform-origin: 0 0; transform: translate(calc(100vw - var(--mx)), var(--my)) rotate(90deg); }
  #app.rot270 { left: 0; top: 0; width: calc(100vh - 2 * var(--my)); height: calc(100vw - 2 * var(--mx)); transform-origin: 0 0; transform: translate(var(--mx), calc(100vh - var(--my))) rotate(-90deg); }

  /* ===== Horizontal ===== */
  #app.h { grid-template-columns: var(--sw) 1fr; grid-template-rows: 1fr auto; grid-template-areas: "side stage" "side lt"; }
  body.no-side #app.h { grid-template-columns: 0 1fr; } body.no-side #side { display: none; }
  /* Lateral: escura com relevo suave (mesmo efeito do painel admin). Vale também no modo vertical (#side vira display:contents). */
  #side { --panel:#e6eaf1; --card:#e6eaf1; --line:rgba(15,42,51,.08); --nsh1:#fff; --nsh2:#c5ccd9; --eh:#fff; --es:rgba(15,42,51,.3); }
  body.side-dark #side { --panel:#0b1c2c; --card:#0e2336; --txt:#eaf2f8; --mut:#9db3c6; --line:rgba(255,255,255,.07); --nsh1: rgba(120,170,210,.07); --nsh2: rgba(0,0,0,.55); --vizbg: rgba(0,0,0,.28); --eh: rgba(140,190,230,.25); --es: rgba(0,0,0,.7); }
  #side { --vizbg:#e6eaf1; color: var(--txt); }
  #side { grid-area: side; display: flex; flex-direction: column; gap: .6rem; padding: .9rem 1.2rem .5rem; background: var(--panel); border-right: 0; box-shadow: .3rem 0 1.2rem rgba(15,42,51,.14); min-height: 0; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 1rem; min-height: 5rem; padding: .7rem 1rem; border-radius: 1.1rem; background: var(--brandBg); color: var(--brandFg); border: 0; box-shadow: .4rem .4rem .9rem var(--nsh2), -.3rem -.3rem .8rem var(--nsh1); }
  .brand img { max-height: 4rem; max-width: 7rem; object-fit: contain; }
  .brand .t1 { font-family: var(--fd); font-size: 1.6rem; font-weight: 700; line-height: 1.05; }
  .brand .t2 { font-size: 1.05rem; opacity: .7; margin-top: .2rem; }
  .clock { text-align: center; }
  .clock .time { font-family: var(--fd); font-size: calc(5.6rem * var(--cs, 1)); font-weight: 700; letter-spacing: .02rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clock .sec { font-family: var(--fd); font-size: calc(2rem * var(--cs, 1)); font-weight: 700; color: var(--clk2, var(--p)); margin-left: .3rem; vertical-align: top; }
  .clock .date { font-size: 1.1rem; color: var(--mut); margin-top: .1rem; }
  .card { background: var(--card); border: 0; border-radius: 1.2rem; padding: .7rem 1.1rem; box-shadow: .45rem .45rem 1rem var(--nsh2), -.35rem -.35rem .9rem var(--nsh1); }
  .weather .wtop { display: flex; align-items: center; gap: .9rem; }
  .weather .ico { font-size: 3.2rem; line-height: 1; }
  .weather .temp { font-family: var(--tf, var(--fd)); font-size: 3.2rem; font-weight: 700; line-height: 1; color: var(--tempc, #1fa35c); text-shadow: -.035em -.035em .02em var(--eh), .04em .05em .05em var(--es); letter-spacing: .02rem; }
  .weather .desc { font-size: 1rem; color: var(--mut); margin-top: .2rem; }
  .weather .minmax { margin-left: auto; text-align: right; font-size: 1rem; color: var(--mut); line-height: 1.5; }
  .weather .city { font-size: .8rem; text-transform: uppercase; letter-spacing: .08rem; color: var(--p); font-weight: 700; }
  .wstats { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .8rem; margin-top: .6rem; font-size: .95rem; color: var(--mut); } .wstats b { color: var(--txt); }
  .weather .minmax .mx, .weather .minmax .mn { display: block; font-size: 1.05rem; } .weather .minmax b { font-size: 1.35rem; color: var(--txt); } .weather .minmax .mx b { color: #d9480f; } .weather .minmax .mn b { color: #1c7ed6; }
  .weather .minmax small, .wdays small { font-size: .62em; font-weight: 700; text-transform: uppercase; letter-spacing: .04rem; color: var(--mut); margin-right: .15rem; }
  .wdays { display: flex; align-items: stretch; gap: .25rem; margin-top: .5rem; padding-top: .45rem; border-top: .06rem solid var(--line); text-align: center; }
  .wdays div { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .1rem; font-size: .88rem; padding: .25rem .1rem; border-radius: .8rem; white-space: nowrap; }
  .wdays b { color: var(--p); font-size: .78rem; text-transform: uppercase; letter-spacing: .04rem; } .wdays span { font-size: 1.45rem; line-height: 1.15; } .wdays i { font-style: normal; font-weight: 700; color: #d9480f; } .wdays u { text-decoration: none; font-weight: 700; color: #1c7ed6; }
  .wdays div.today { flex: 1.9; background: color-mix(in srgb, var(--p) 14%, transparent); box-shadow: inset .15rem .15rem .4rem var(--nsh2), inset -.12rem -.12rem .3rem var(--nsh1); gap: .15rem; font-size: 1.05rem; }
  .wdays .today b { color: var(--s); font-size: 1rem; letter-spacing: .08rem; } .wdays .today span { font-size: 2.5rem; } .wdays .today i, .wdays .today u { font-size: 1.25rem; }
  .wupd { display: none; }
  .sched { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .h2 { font-size: .8rem; font-weight: 700; color: var(--p); letter-spacing: .15rem; text-transform: uppercase; margin-bottom: .45rem; }
  #schedList { flex: 1; min-height: 6.2rem; overflow: hidden; position: relative; }
  .row { display: flex; gap: .8rem; padding: .28rem 0; border-bottom: .06rem solid var(--line); font-size: 1.1rem; line-height: 1.25; }
  .row b { color: var(--p); min-width: 3.8rem; font-variant-numeric: tabular-nums; }
  .row.past { opacity: .4; }
  .row.now { background: color-mix(in srgb, var(--p) 16%, transparent); margin: .1rem -.5rem; padding-left: .6rem; padding-right: .6rem; border-radius: .7rem; border-bottom-color: transparent; font-weight: 700; box-shadow: inset .2rem .2rem .5rem var(--nsh2), inset -.15rem -.15rem .4rem var(--nsh1); }
  .row.now b { color: var(--s); }
  .empty { color: var(--mut); font-size: 1rem; padding: .6rem 0; }
  .verse { background: color-mix(in srgb, var(--s) 7%, var(--card)); min-height: 0; padding-top: .6rem; padding-bottom: .6rem; display: flex; flex-direction: column; justify-content: center; transition: opacity .6s; }
  .verse .vt { font-size: 1.1rem; line-height: 1.3; font-weight: 500; font-style: italic; }
  .verse .vr { margin-top: .5rem; color: var(--s); font-weight: 700; font-size: 1rem; } .verse .h2 { color: var(--s); }
  .credit { display: none; font-size: .75rem; color: var(--mut); text-align: center; opacity: .8; }

  /* Logo da clínica entre a programação e a rádio */
  #sideLogo { flex: none; margin-top: .6rem; height: calc(6.2rem * var(--slh, 1)); display: flex; align-items: center; justify-content: center; padding: .3rem; border-radius: 1rem; background: var(--slbg, #fff); overflow: hidden; box-shadow: .2rem .2rem .5rem var(--nsh2), -.15rem -.15rem .4rem var(--nsh1); }
  #sideLogo[hidden], body.no-sidelogo #sideLogo { display: none; } #sideLogo img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ===== Palco com moldura ===== */
  #stage { grid-area: stage; position: relative; min-height: 0; padding: 1.4rem 1.4rem .8rem; }
  #frame { position: absolute; inset: 1.4rem 1.4rem .8rem; border-radius: 1.8rem; overflow: hidden; background: #000; box-shadow: 0 0 0 .3rem #fff, 0 0 0 .5rem var(--p), var(--shadow); }
  #app.fullbleed #stage { padding: 0; } #app.fullbleed #frame { inset: 0; border-radius: 0; box-shadow: none; }
  .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), clip-path 1.1s cubic-bezier(.7,0,.2,1), visibility 0s 1s; }
  .slide.on { opacity: 1; visibility: visible; transform: none; clip-path: inset(0); transition-delay: 0s; }
  .tr-slide { transform: translateX(14%); } .tr-zoom { transform: scale(1.2); } .tr-flip { transform: perspective(90rem) rotateY(75deg); } .tr-blur { transform: scale(1.08); } .tr-wipe { clip-path: inset(0 100% 0 0); }
  .slide .img { will-change: transform; position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: cover; }
  .slide .img.contain { background-size: contain; }
  .slide .bgb { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(2.2rem) brightness(.55); }
  .slide video, .slide iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; background: #000; }
  .slide.on.kb-in .img { animation: kbin var(--dur,14s) ease-out both; } .slide.on.kb-out .img { animation: kbout var(--dur,14s) ease-out both; } .slide.on.kb-pan .img { animation: kbpan var(--dur,14s) ease-in-out both; }
  @keyframes kbin { from { transform: scale(1); } to { transform: scale(1.14); } } @keyframes kbout { from { transform: scale(1.14); } to { transform: scale(1); } } @keyframes kbpan { from { transform: scale(1.12) translateX(-3%); } to { transform: scale(1.12) translateX(3%); } }
  #tvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; background: transparent; } #tvid.on { opacity: 1; }
  .tr-video { transition-duration: .35s, .35s, .35s; }
  .slide .bgvid { z-index: 0; } .slide.hasvid::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 1; }
  /* vídeo mantendo o formato: caixa com o tamanho certo do vídeo, posição à esquerda/centro/direita, imagem ao lado e linha suave */
  .vbox .vwrap { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; gap: 2.2rem; padding: 2rem 2.4rem; }
  .vwrap.pos-esquerda { justify-content: flex-start; } .vwrap.pos-centro { justify-content: center; } .vwrap.pos-direita { justify-content: flex-end; }
  .vbox .vwrap video.vmain { position: relative; inset: auto; flex: none; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 1.4rem; background: #000; opacity: 0; transition: opacity .4s; }
  .vbox .vside { flex: 1; min-width: 0; align-self: stretch; border-radius: 1.4rem; background-position: center; background-repeat: no-repeat; }
  .vbox .vbgimg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .vwrap.vline .vmain, .vwrap.vline .vside { box-shadow: 0 0 0 var(--vlw, 4px) color-mix(in srgb, var(--vlc, #fff) 55%, transparent), 0 0 2.4rem color-mix(in srgb, var(--vlc, #fff) 30%, transparent); }
  .slide.text { flex-direction: column; padding: 4rem; }
  .slide.text::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 82% 18%, rgba(255,255,255,.14), transparent 45%); pointer-events: none; }
  .slide .ic { font-size: 8rem; line-height: 1; margin-bottom: 1.4rem; position: relative; z-index: 1; }
  .slide .tx { position: relative; z-index: 2; max-width: 100%; } .slide .tx2 { margin-top: 1.2rem; max-width: 56rem; }
  .ov { position: absolute; left: 0; right: 0; z-index: 3; padding: 2.4rem 3rem; display: flex; flex-direction: column; gap: .8rem; text-align: left; }
  .ov.pos-bottom { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,.78), transparent); padding-top: 6rem; }
  .ov.pos-top { top: 0; background: linear-gradient(180deg, rgba(0,0,0,.78), transparent); padding-bottom: 6rem; }
  .ov.pos-center { top: 0; bottom: 0; justify-content: center; align-items: center; text-align: center; background: rgba(0,0,0,.35); }
  /* modelo aniversariante */
  .slide.niv { background: radial-gradient(circle at 30% 40%, var(--b1), var(--b2) 72%); gap: 5rem; padding: 3rem 5rem; }
  .niv .pol { position: relative; z-index: 2; width: 24rem; aspect-ratio: 3/4; max-height: 80%; background: #fff; border-radius: 2rem; box-shadow: 0 1.2rem 3rem rgba(0,0,0,.5); transform: rotate(-3deg); animation: pol 6s ease-in-out infinite alternate; }
  .niv .pol .img, .niv .pol video { inset: .9rem; width: calc(100% - 1.8rem); height: calc(100% - 1.8rem); border-radius: 1.3rem; }
  @keyframes pol { to { transform: rotate(3deg) scale(1.03); } }
  .niv .who { position: relative; z-index: 2; max-width: 44rem; text-align: left; } .niv .who .pre { font-family: var(--fd); font-size: 2.2rem; color: #fff; opacity: .9; } .niv .who .tx2 { margin-top: 1rem; }
  /* modelo campanha / dica */
  .slide.dc { display: grid; grid-template-columns: 1.8fr 1fr; text-align: left; background: linear-gradient(160deg, var(--b1), var(--b2)); }
  .dc .ph { position: relative; overflow: hidden; } .dc .pn { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; padding: 3rem; }
  /* zonas: retângulos (em % da tela) com imagem, vídeo, YouTube ou texto */
  .slide.zonas { display: block; } .zone { position: absolute; overflow: hidden; z-index: 2; }
  .zone .img, .zone video, .zone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background-position: center; background-repeat: no-repeat; }
  .zone .pl { transition: opacity .6s; } .zone.zlist { background: transparent; }
  .zone .ztext { position: absolute; inset: 0; display: flex; align-items: center; padding: .6rem 1rem; font-family: var(--fd), sans-serif; font-weight: 700; line-height: 1.15; white-space: pre-line; text-shadow: 0 .1rem .4rem rgba(0,0,0,.35); overflow: hidden; }
  #vErr { position: absolute; left: 1rem; top: 1rem; z-index: 30; max-width: 70%; padding: .5rem 1rem; border-radius: .8rem; background: rgba(160,30,30,.92); color: #fff; font: 600 1rem/1.3 system-ui, sans-serif; display: none; } #vErr.on { display: block; }
  /* efeitos de fundo animados */
  .bgfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; } .bgfx i { position: absolute; display: block; }
  .bgfx i { will-change: transform; }
  .bgfx-aurora i { width: 70%; height: 70%; border-radius: 50%; background: radial-gradient(circle, var(--ac) 0%, transparent 68%); opacity: .55; animation: aur 14s ease-in-out infinite alternate; }
  .bgfx-aurora i:nth-child(1) { --ac: #5eead4; left: -10%; top: -10%; } .bgfx-aurora i:nth-child(2) { --ac: #a78bfa; right: -15%; top: 20%; animation-duration: 19s; } .bgfx-aurora i:nth-child(3) { --ac: #38bdf8; left: 20%; bottom: -25%; animation-duration: 23s; }
  @keyframes aur { to { transform: translate(18%, 12%) scale(1.25); } }
  .bgfx-bolhas i { bottom: -10%; border-radius: 50%; border: .15rem solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); animation: rise linear infinite; } @keyframes rise { to { transform: translateY(-140rem); } }
  .bgfx-confete i { top: -8%; width: .8rem; height: 1.4rem; animation: fall linear infinite; } @keyframes fall { to { transform: translateY(140rem) rotate(720deg); } }
  .bgfx-brilhos i { border-radius: 50%; background: #fff; box-shadow: 0 0 .8rem #fff; animation: tw ease-in-out infinite; } @keyframes tw { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
  .bgfx-ondas svg { position: absolute; left: 0; width: 200%; animation: wave 14s linear infinite; } .bgfx-ondas svg path { fill: rgba(255,255,255,.14); }
  .bgfx-ondas svg:nth-child(1) { bottom: 0; height: 34%; } .bgfx-ondas svg:nth-child(2) { bottom: 0; height: 26%; animation-duration: 22s; animation-direction: reverse; } @keyframes wave { to { transform: translateX(-50%); } }

  /* Rádio */
  #radio { flex: none; margin-top: .5rem; padding: .45rem .8rem; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .4rem .8rem; align-items: center; border-radius: 1rem; background: var(--vizbg); box-shadow: inset .2rem .2rem .5rem var(--nsh2), inset -.15rem -.15rem .4rem var(--nsh1); cursor: pointer; }
  #radio[hidden] { display: none; }
  #radio .rb { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--p); display: grid; place-items: center; font-size: 1.1rem; color: #fff; box-shadow: .15rem .15rem .4rem var(--nsh2), -.1rem -.1rem .3rem var(--nsh1); }
  #radio .rn { font-size: .78rem; font-weight: 700; letter-spacing: .06rem; text-transform: uppercase; color: var(--p); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #radio .rt { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
  #radio #viz { grid-column: 1 / -1; width: 100%; height: 2.2rem; display: block; }
  #radio.hint .rb { animation: hintp 1.2s ease-in-out infinite; } @keyframes hintp { 50% { transform: scale(1.15); } }

  /* ===== Barra de notícias com data e hora ===== */
  #lt { --bc: var(--p); grid-area: lt; margin: .1rem 1.4rem 1.2rem; background: var(--lt); border-radius: 1.2rem; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
  #app.fullbleed #lt { margin: 0; border-radius: 0; box-shadow: 0 -.3rem 1.2rem rgba(0,0,0,.25); } #app.fullbleed.v #lt { margin: 0; }
  .lt-head { display: flex; align-items: stretch; min-height: 6.2rem; min-width: 0; }
  .lt-date { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: .3rem; min-width: 11.5rem; padding: .6rem 1.2rem; background: linear-gradient(160deg, #0e4f80, #0a2c4d); color: #fff; line-height: 1; position: relative; }
  .lt-date::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: .3rem; background: var(--bc); transition: background .6s; }
  .lt-date .dd { display: flex; align-items: center; justify-content: center; gap: .7rem; }
  .lt-date b { font-family: var(--fd); font-size: 3.2rem; font-weight: 700; line-height: .95; }
  .lt-date .mw { display: flex; flex-direction: column; gap: .3rem; text-align: left; }
  .lt-date small { font-size: 1.15rem; font-weight: 800; letter-spacing: .12rem; } .lt-date .mw span { font-size: .85rem; letter-spacing: .1rem; opacity: .7; }
  .lt-date em { font-style: normal; font-family: var(--fd); font-size: 1.35rem; font-weight: 700; text-align: center; padding: .22rem .6rem; border-radius: 99rem; background: rgba(255,255,255,.12); color: #a6f3e8; font-variant-numeric: tabular-nums; letter-spacing: .04rem; }
  .lt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: .35rem; padding: .6rem 1.8rem; }
  .lt-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: .4rem; padding: .22rem 1.1rem; color: #fff; font-weight: 800; font-size: .95rem; letter-spacing: .1rem; text-transform: uppercase; border-radius: 99rem; white-space: nowrap; box-shadow: 0 .2rem .8rem color-mix(in srgb, var(--bc) 50%, transparent); transition: background .6s; }
  .lt-text { font-family: var(--fd); font-size: 2rem; font-weight: 700; line-height: 1.15; color: var(--ltTxt); max-height: 2.35em; overflow: hidden; }
  .lt-detail { font-size: 1.2rem; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-crawl { position: relative; height: calc(2.9rem * max(1, var(--ts, 1))); overflow: hidden; display: flex; align-items: center; background: var(--crawl); color: var(--crawlTxt); }
  #tScroll { position: absolute; left: 0; white-space: nowrap; font-size: calc(1.3rem * var(--ts, 1)); font-weight: 500; will-change: transform; } #tScroll em { font-style: normal; font-weight: 800; margin-right: .4rem; } #tScroll i { font-style: normal; color: var(--s); margin: 0 1.6rem; }

  /* ===== Vertical (monitor girado, totem ou celular) ===== */
  #app.v { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto auto; grid-template-areas: "brand brand" "clock weather" "stage stage" "sched verse" "lt lt"; }
  #app.v #side { display: contents; }
  #app.v .brand { grid-area: brand; border-radius: 0; border: 0; border-bottom: .08rem solid var(--line); padding: 1rem 1.8rem; }
  #app.v .clock { grid-area: clock; background: var(--panel); padding: 1rem; display: flex; flex-direction: column; justify-content: center; } #app.v .clock .time { font-size: calc(5.4rem * var(--cs, 1)); }
  #app.v .weather { grid-area: weather; border-radius: 0; background: var(--panel); border: 0; border-left: .08rem solid var(--line); }

<script>
(function () {

  /* ================= Clima em tempo real (Open-Meteo) com previsão de 5 dias ================= */
  const WMO = { 0: ['☀️', 'Céu limpo'], 1: ['🌤️', 'Quase limpo'], 2: ['⛅', 'Parcialmente nublado'], 3: ['☁️', 'Nublado'], 45: ['🌫️', 'Neblina'], 48: ['🌫️', 'Neblina'], 51: ['🌦️', 'Garoa'], 53: ['🌦️', 'Garoa'], 55: ['🌦️', 'Garoa forte'], 61: ['🌧️', 'Chuva fraca'], 63: ['🌧️', 'Chuva'], 65: ['🌧️', 'Chuva forte'], 80: ['🌦️', 'Pancadas de chuva'], 81: ['🌧️', 'Pancadas de chuva'], 82: ['⛈️', 'Chuva intensa'], 95: ['⛈️', 'Tempestade'], 96: ['⛈️', 'Tempestade com granizo'], 99: ['⛈️', 'Tempestade com granizo'] };
  const wmo = (c) => WMO[c] || (c <= 3 ? ['⛅', 'Parcialmente nublado'] : c <= 48 ? ['🌫️', 'Neblina'] : c <= 57 ? ['🌦️', 'Garoa'] : c <= 67 ? ['🌧️', 'Chuva'] : c <= 82 ? ['🌦️', 'Pancadas de chuva'] : ['⛈️', 'Tempestade']);
  let wTimer = null;
  async function weather() {

      const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +

      $('wHum').textContent = Math.round(c.relative_humidity_2m) + '%'; $('wWind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
      $('wFeel').textContent = Math.round(c.apparent_temperature) + '°'; $('wRain').textContent = Math.round(d.precipitation_probability_max[0] || 0) + '%';
      $('wDays').innerHTML = d.time.map((x, k) => '<div' + (k ? '' : ' class="today"') + '><b>' + (k ? new Date(x + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '') : 'Hoje') + '</b><span>' + wmo(d.weather_code[k])[0] + '</span><i><small>máx</small>' + Math.round(d.temperature_2m_max[k]) + '°</i><u><small>mín</small>' + Math.round(d.temperature_2m_min[k]) + '°</u></div>').join('');
      const n = new Date(); $('wUpd').textContent = 'Atualizado às ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
    } catch (e) { $('wDesc').textContent = 'Clima indisponível'; }

  }

  /* ================= Barra de notícias (data e hora + manchete + faixa) e serviços ================= */
  const catOf = (id) => cfg.categories.find((c) => c.id === id) || { label: 'Informação', icon: 'ℹ️', color: '#1fb6a6' };
  /* ----- notícias automáticas (endereços cadastrados no admin) ----- */
  const NCACHE = 'infotv_news_cache'; let newsMap = {}, newsT = [], newsSig = '';

  function newsItems() {
    const out = [], now = Date.now();
    (cfg.newsSources || []).filter((s) => s.active !== false && s.url).forEach((s) => {
      const e = newsMap[s.id]; if (!e || now - e.t > 3 * 3600 * 1000) return;   // dado com mais de 3 h não é mostrado

  }
  async function newsRefresh(s) {

    const sig = JSON.stringify(newsItems()); if (sig !== newsSig) { newsSig = sig; lowerThird(); }
  }
  function newsSetup() {
    newsT.forEach(clearInterval); newsT = []; newsLoad(); newsSig = JSON.stringify(newsItems());
    (cfg.newsSources || []).filter((s) => s.active !== false && s.url).forEach((s) => {
      const e = newsMap[s.id], run = () => newsRefresh(s);
      if (!e || Date.now() - e.t > s.minutes * 60000) run();

    });
  }

  const items = () => { const t = new Date().toISOString().slice(0, 10); return (cfg.ticker || []).filter((x) => x.active !== false && x.text && (!x.start || x.start <= t) && (!x.end || x.end >= t)).concat(newsItems()); };
  let hTimer = null, hIdx = -1, tRaf = null;
  function lowerThird() {
    clearTimeout(hTimer); cancelAnimationFrame(tRaf);
    const tf = cfg.general.tickerFont ? "'" + cfg.general.tickerFont + "', var(--fd), sans-serif" : '';
    $('tScroll').style.fontFamily = tf;
    const list = items(), lt = $('lt');
    if (!list.length) { lt.style.display = 'none'; return; }
    lt.style.display = ''; hIdx = -1;
    const show = () => {
      hIdx = (hIdx + 1) % list.length; const it = list[hIdx], c = catOf(it.cat);
      lt.style.setProperty('--bc', c.color); $('ltBadge').style.background = c.color; $('ltBadge').textContent = ((c.icon || '') + ' ' + c.label).trim();
      const box = $('ltText'); box.innerHTML = ''; const sp = document.createElement('span');
      InfoFX.text(sp, it.text, { effect: 'none', anim: it.anim || 'up', color: 'var(--ltTxt)', font: cfg.general.tickerFont || '' }, 0); box.appendChild(sp);
      $('ltDetail').textContent = it.detail || ''; $('ltDetail').style.display = it.detail ? '' : 'none';
      hTimer = setTimeout(show, Math.max(4, +it.seconds || +cfg.general.headlineSeconds || 9) * 1000);
    };
    show();
    const dark = document.body.classList.contains('dark'), el = $('tScroll'); el.innerHTML = '';
    list.forEach((it) => {
      const c = catOf(it.cat), e = document.createElement('em'); e.textContent = (c.icon || '') + ' ' + c.label.toUpperCase() + ':'; e.style.color = dark ? lighten(c.color) : c.color;
      const s = document.createElement('span'); s.textContent = it.text; const sep = document.createElement('i'); sep.textContent = '●';
      el.append(e, s, sep);

    const track = el.parentElement; let tw = track.offsetWidth, ew = el.offsetWidth, fr = 0, x = tw, last = performance.now();
    (function step(now) {
      const rem = REMK;

      if (++fr % 240 === 0) { tw = track.offsetWidth; ew = el.offsetWidth; }
      if (x < -ew) x = tw;

  }
  function lighten(hex) {
    const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex || ''); if (!m) return '#fff';

    return 'rgb(' + f(m[1]) + ',' + f(m[2]) + ',' + f(m[3]) + ')';
  }
  /* ================= Publicações (slides): modelos, entradas e efeitos ================= */
  let sIdx = -1, sTimer = null, curEl = null;
  function validSlides() {
    if (PREVIEW && Q.get('slide')) { const one = (cfg.slides || []).find((x) => x.id === Q.get('slide')); if (one) return [one]; }   // pré-visualização de uma publicação só
    const today = new Date().toISOString().slice(0, 10);
    return (cfg.slides || []).filter((s) => s.active !== false && (!s.start || s.start <= today) && (!s.end || s.end >= today));
  }
  function ytId(u) { const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : ''); }
  function textBlock(cls, st, base) { const w = document.createElement('div'); w.className = cls; if (st && st.text) { const s = document.createElement('span'); InfoFX.text(s, st.text, st, base); w.appendChild(s); } return w; }
  /* ----- aviso discreto quando um vídeo não abre (ajuda a achar o problema na TV) ----- */
  let errT = null;
  function badge(msg) { const b = $('vErr'); if (!b) return; b.textContent = '⚠ ' + msg; b.classList.add('on'); clearTimeout(errT); errT = setTimeout(() => b.classList.remove('on'), 7000); try { console.warn('[ClinicaTV] ' + msg); } catch (e) {} }
  const MERR = { 1: 'carregamento interrompido', 2: 'falha de rede ao baixar o arquivo', 3: 'o navegador não conseguiu decodificar o vídeo', 4: 'formato ou endereço não suportado (use MP4 H.264 + AAC e confira o caminho)' };

  /* ----- vídeo MP4: sempre mudo (a TV não bloqueia), com ganchos para saber quando começa, termina ou falha ----- */
  function videoEl(src, o) {
    const h = o.hooks || {}, v = document.createElement('video');
    o.sound = !!o.sound && !PREVIEW;
    v.muted = !o.sound; v.defaultMuted = !o.sound; v.autoplay = true; v.playsInline = true; v.preload = 'auto'; v.loop = !!o.loop; v.setAttribute('playsinline', '');
    const go = () => { const p = v.play(); if (p && p.catch) p.catch(() => { if (!v.muted) { v.muted = true; v.play().catch(() => {}); } }); };
    v.addEventListener('canplay', go, { once: true });
    v.addEventListener('playing', () => { if (o.sound && !v.muted) rHold(); h.onPlay && h.onPlay(); });
    v.addEventListener('pause', () => { if (v.ended) return; });
    v.addEventListener('ended', () => { if (!v.loop) h.onEnd && h.onEnd(); });

      badge('vídeo não abriu: ' + (MERR[c] || 'erro desconhecido') + ' — ' + String(src).split('/').pop()); h.onFail && h.onFail();
    });

  }

  /* ----- YouTube com a API oficial: sabe quando o vídeo termina e devolve a tela aos slides ----- */
  let ytP = null;
  function ytAPI() {

  }
  function whenConnected(node, fn, n) { if (node.isConnected) return fn(); if ((n || 0) > 300) return; requestAnimationFrame(() => whenConnected(node, fn, (n || 0) + 1)); }
  function ytFrame(src, o) {

    } catch (e) { $('rTitle').textContent = 'Ao vivo'; }
    rNP = setTimeout(rNowPlaying, 20000);
  }
  function radioApply() {
    const r = cfg.radio, box = $('radio');
    if (!r.enabled || !r.stations.length) { box.hidden = true; rWant = false; if (audio) audio.pause(); rSig = ''; return; }
    box.hidden = false;
    if (PREVIEW) { rIdx = Math.min(Math.max(0, +r.current || 0), r.stations.length - 1); rUI(); return; }
    if (audio) audio.volume = Math.min(1, Math.max(0, +r.volume || 0.6));
    // trocou a rádio escolhida (ou algum endereço) no admin → muda na hora; só mexer em volume/outros ajustes não reinicia o som
    const cur = Math.min(Math.max(0, +r.current || 0), r.stations.length - 1), sig = JSON.stringify(r.stations.map((s) => s.url)) + '|' + cur;
    if (sig !== rSig) { const was = playing(); rSig = sig; rSet(cur); if (r.autoplay || was) rPlay(); } else rUI();
  }

  /* Gráfico de som: usa o sinal real da rádio quando ela libera; senão anima sozinho (nunca fica parado) */
  const viz = $('viz'), vctx = viz.getContext('2d'), VN = 34;
  const vPh = Array.from({ length: VN }, () => Math.random() * 6.28), vSp = Array.from({ length: VN }, () => 1.5 + Math.random() * 3.4), vLv = new Array(VN).fill(0.05);
  let vE = 0.2, vLast = 0, vSig = 0;
  function vizLevels(t) {
    const s = t / 1000, lv = new Array(VN);
    if (playing() && analyser && fdata && actx && actx.state === 'running') {
      analyser.getByteFrequencyData(fdata); let sum = 0;
      for (let i = 0; i < VN; i++) { const idx = Math.min(fdata.length - 1, 1 + Math.floor(Math.pow(i / VN, 1.6) * fdata.length * 0.7)); const v = fdata[idx] / 255; sum += v; lv[i] = Math.min(1, Math.pow(v, 1.1) * 1.3); }
      if (sum > 0.4) vSig = t;
      if (t - vSig < 6000) { for (let i = 0; i < VN; i++) { vLv[i] += (lv[i] - vLv[i]) * (lv[i] > vLv[i] ? 0.6 : 0.2); lv[i] = Math.max(0.04, vLv[i]); } return lv; }
    }
    // animação própria: forte quando toca; suave (mas viva) quando parada ou no preview do admin
    vE += ((playing() ? 1 : (PREVIEW ? 0.6 : 0.28)) - vE) * 0.08;
    for (let i = 0; i < VN; i++) { const env = Math.pow(Math.abs(Math.sin(s * vSp[i] + vPh[i])), 1.25) * (0.55 + 0.45 * Math.sin(s * 0.9 + i * 0.35)) * (1 - i / VN * 0.3); vLv[i] = Math.max(0.05, vE * (0.14 + 0.86 * env)); lv[i] = vLv[i]; }
    return lv;
  }
  function vizLoop(t) {
    requestAnimationFrame(vizLoop);
    if (!cfg) return;
    const rr = cfg.radio, on = !$('radio').hidden && rr.viz !== 'off';
    if (viz.style.display !== (on ? '' : 'none')) viz.style.display = on ? '' : 'none';
    const mode = rr.viz; if (!on || t - vLast < 33) return; vLast = t;
    const dpr = Math.min(1.5, window.devicePixelRatio || 1), w = Math.round(viz.clientWidth * dpr), h = Math.round(viz.clientHeight * dpr);
    if (!w || !h) return; if (viz.width !== w || viz.height !== h) { viz.width = w; viz.height = h; }
    const g = cfg.general, c1 = g.primary || '#1fb6a6', c2 = g.secondary || '#d4a93c', lv = vizLevels(t);
    vctx.clearRect(0, 0, w, h);
    const gr = vctx.createLinearGradient(0, h, 0, 0); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    vctx.fillStyle = gr; vctx.strokeStyle = gr;
    if (mode === 'onda') {
      const pts = lv.map((v, i) => [i / (VN - 1) * w, h / 2 - (v * h * 0.46) * (i % 2 ? 1 : -1)]);
      vctx.lineWidth = Math.max(2, h * 0.07); vctx.lineCap = 'round'; vctx.beginPath(); vctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; vctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); }
      vctx.stroke(); vctx.globalAlpha = 0.25; vctx.lineTo(w, h / 2); vctx.lineTo(0, h / 2); vctx.fill(); vctx.globalAlpha = 1; return;
    }
    const step = w / VN, bw = step * 0.62;
    for (let i = 0; i < VN; i++) {
      const bh = Math.max(bw, lv[i] * h), x = i * step + (step - bw) / 2, y = mode === 'espelho' ? (h - bh) / 2 : h - bh;
      vctx.beginPath(); vctx.roundRect ? vctx.roundRect(x, y, bw, bh, bw / 2) : vctx.rect(x, y, bw, bh); vctx.fill();
    }
  }
  requestAnimationFrame(vizLoop);
  $('radio').addEventListener('click', (e) => { e.stopPropagation(); rToggle(); });
  // 1º toque/tecla libera o áudio quando o navegador bloqueia o autoplay
  ['click', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, () => { if (actx && actx.state === 'suspended') actx.resume().catch(() => {}); if (cfg && cfg.radio.enabled && cfg.radio.autoplay && rWant && audio && audio.paused) rPlay(); }, { passive: true }));

  /* ================= Tela cheia / giro / atalhos ================= */
  function fullscreen() {
    const d = document.documentElement;
    if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch(() => {}); else document.exitFullscreen();
  }
  function rotate() {
    const order = ['h', 'v', 'v90', 'v270'], cur = orient(), nx = order[(order.indexOf(cur) + 1) % order.length];
    InfoTV.setOrient(nx === (cfg.general.orientation || 'h') ? '' : nx);
    if (Q.get('o')) { const u = new URL(location.href); u.searchParams.set('o', nx); location.href = u; return; }
    layout(); lowerThird(); renderSchedule();
  }
  $('bFull').onclick = fullscreen; $('bRot').onclick = rotate; $('bMute').onclick = rToggle;
  addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'f') fullscreen(); if (k === 'r') rotate(); if (k === 'm') rToggle(); if (k === 'n' && cfg.radio.stations.length > 1) { rSet((rIdx + 1) % cfg.radio.stations.length); rPlay(); } });
  // tela cheia automática: o navegador só permite depois de um toque/clique/tecla; no 1º gesto a TV já entra em tela cheia
  function autoFull() {
    if (PREVIEW || !cfg || cfg.general.autoFullscreen === false || document.fullscreenElement) return;
    const d = document.documentElement; try { ((d.requestFullscreen || d.webkitRequestFullscreen) || (() => Promise.resolve())).call(d).catch(() => {}); } catch (e) {}
  }
  ['click', 'keydown', 'touchend'].forEach((ev) => addEventListener(ev, (e) => { if (ev === 'keydown' && ['f', 'F'].includes(e.key)) return; autoFull(); }, { passive: true }));
  let uiT; addEventListener('mousemove', () => { document.body.classList.add('show-ui'); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove('show-ui'), 3000); });
  async function wake() { try { if (!PREVIEW && 'wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

  /* ================= Aplicar configuração ================= */
  let customFontEl = null;
  function apply() {
    const g = cfg.general, root = document.documentElement.style;
    root.setProperty('--p', g.primary || '#1fb6a6'); root.setProperty('--s', g.secondary || '#d4a93c');
    root.setProperty('--brandBg', g.brandBg || '#fff'); root.setProperty('--brandFg', g.brandFg || '#0b1d2e');
    if (!customFontEl) { customFontEl = document.createElement('style'); document.head.appendChild(customFontEl); }
    customFontEl.textContent = g.fontCustomSrc ? "@font-face{font-family:'InfoCustom';src:url('" + g.fontCustomSrc + "');font-display:swap}" : '';
    const fd = g.fontCustomSrc ? 'InfoCustom' : g.fontDisplay;
    root.setProperty('--fd', "'" + fd + "', 'Comfortaa', sans-serif"); root.setProperty('--fb', "'" + (g.fontBody || 'Agency') + "', 'Montserrat', sans-serif");
    $('name').textContent = g.name; $('subtitle').textContent = g.subtitle || '';
    document.title = 'Clínica TV · ' + g.name;
    const lg = $('logo'); if (g.logo) { lg.src = g.logo; lg.hidden = false; } else lg.hidden = true;
    const ck = Object.assign({}, InfoTV.DEFAULT.general.clock, g.clock); ck.anim = 'none';
    // relógio padrão é claro com neon (lateral escura); se a lateral for clara, volta ao azul forte para ter contraste
    if ((g.theme === 'escuro' || g.sidebarStyle === 'escura') && ck.color === InfoTV.DEFAULT.general.clock.color) Object.assign(ck, { color: '#6fb8ff', g1: '#9bd5ff', g2: '#38bdf8' });
    InfoFX.style($('time'), ck, 0); $('time').className += ' time'; $('time').style.fontSize = '';
    $('sec').style.fontFamily = $('time').style.fontFamily; root.setProperty('--tf', ck.font ? "'" + ck.font + "', var(--fd)" : 'var(--fd)'); root.setProperty('--tempc', g.tempColor || '#1fa35c'); root.setProperty('--clk2', ck.g2 || ck.glow || g.primary);
    const sl = $('sideLogo'), sli = $('sideLogoImg');
    if (g.sideLogo && g.sideLogoShow !== false) { if (sli.getAttribute('src') !== g.sideLogo) sli.src = g.sideLogo; sl.hidden = false; } else sl.hidden = true;
    root.setProperty('--slh', Math.min(2.2, Math.max(0.5, (+g.sideLogoH || 100) / 100))); root.setProperty('--slbg', g.sideLogoBg || '#ffffff');
    layout(); renderSchedule(); nextVerse(); weather(); newsSetup(); lowerThird(); radioApply();
    sIdx = -1; nextSlide();
  }

  async function init() {
    cfg = await InfoTV.load();
    apply(); tick(); setInterval(tick, 1000); wake();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitClock(); });
    let ct; InfoTV.onChange(() => { clearTimeout(ct); ct = setTimeout(async () => { cfg = await InfoTV.load(); apply(); }, 1200); });
    setInterval(async () => {   // modo GitHub: confere config.json a cada 2 minutos
      if (InfoTV.getMode() !== 'repo' || await InfoTV.isServer()) return;
      const n = await InfoTV.loadRepo();
      if (n && JSON.stringify(n) !== JSON.stringify(cfg)) { cfg = n; apply(); }
    }, 120000);
    // versão nova do sistema publicada (GitHub ou servidor)? confere a cada 10 min e recarrega sozinho
    if (!PREVIEW) setInterval(async () => {
      try { const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text(); const m = /<meta name="build" content="([^"]+)"/.exec(t), cur = document.querySelector('meta[name=build]'); if (m && cur && m[1] !== cur.content) location.reload(); } catch (e) {}
    }, 10 * 60 * 1000);
    if (!PREVIEW) setTimeout(() => location.reload(), 24 * 3600 * 1000);   // recarrega 1x por dia
  }
  init();
})();
</script>
