return'<div class=card><h2>Registro de desempenho</h2><p class=sub>Paciente: '+esc(pn())+(p?' · '+age(p.nascimento)+' anos':'')+'. Gráfico de acertos por sessão: registros de desempenho nas atividades, não diagnóstico.</p>'+(p&&p.observacoes?'<p><b>Observações do cadastro:</b> '+esc(p.observacoes)+'</p>':'')+'<canvas id=cv width=640 height=220 style="width:100%"></canvas><button class="b p" onclick="saveAll()">💾 Exportar todas as sessões (JSON)</button></div><div class=card><div class=scr><table><tr><th>Data<th>Atividade<th>Tempo<th>Tent.<th>Acertos<th>Não rec.<th>Pontos<th>Obs.<th></tr>'+ss.map(s=>'<tr><td>'+new Date(s.dt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'<td>'+esc(s.mod)+'<td>'+s.sec+'s<td>'+s.n+'<td>'+s.ok+'<td>'+(s.n-s.ok)+'<td>'+s.ok+'/'+s.n+'<td><input value="'+esc(s.obs||'')+'" onchange="ob(\''+s.id+'\',this.value)"><td><button class="b y" onclick="saveS('+s.id+')">💾</button></tr>').join('')+'</table></div>'+(ss.length?'':'<p>Nenhuma sessão registrada.</p>')+'</div>'};
const CF=[['nm','Nome do aplicativo','t'],['m','Modo','s',[['kid','Infantil'],['teen','Adolescente'],['adult','Adulto']]],['dk','Modo escuro','c'],['ch','Personagem','s',[['f','Feminino'],['m','Masculino']]],['av','Personagem ativo','c'],['an','Animações','c'],['rw','Recompensas','c'],['tts','Instruções faladas','c'],['stt','Reconhecimento de voz','c'],['rate','Velocidade da fala','s',[[.5,'0,5x'],[.75,'0,75x'],[1,'1x']]],['pause','Pausa entre sílabas','s',[[500,'0,5 s'],[900,'0,9 s'],[1500,'1,5 s'],[2200,'2,2 s']]],['tries','Tentativas por palavra','s',[[1,'1'],[2,'2'],[3,'3']]],['tol','Tolerância do reconhecimento','s',[[.5,'Alta'],[.6,'Média'],[.75,'Baixa']]],['hold','Tempo de sustentação','s',[[3,'3 s'],[5,'5 s'],[10,'10 s']]],['reps','Repetições','s',[[2,'2'],[3,'3'],[5,'5']]],['vol','Volume','s',[[.5,'50%'],[.75,'75%'],[1,'100%']]],['as','Baixar JSON ao concluir cada teste','c']];
T.cfg=()=>'<div class=card><h2>Configurações</h2>'+CF.map(f=>'<small>'+f[1]+'</small>'+(f[2]=='t'?'<input value="'+esc(C[f[0]])+'" onchange="cf(\''+f[0]+'\',this.value)">':f[2]=='c'?'<select onchange="cf(\''+f[0]+'\',this.value)"><option value=1 '+(+C[f[0]]?'selected':'')+'>Ativado</option><option value=0 '+(+C[f[0]]?'':'selected')+'>Desativado</option></select>':'<select onchange="cf(\''+f[0]+'\',this.value)">'+f[3].map(o=>'<option value="'+o[0]+'" '+(String(C[f[0]])==String(o[0])?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>')).join('')+'<small>Voz (português do Brasil)</small><select onchange="cf(\'vz\',this.value)"><option value="">Automática</option>'+(window.speechSynthesis?speechSynthesis.getVoices().filter(v=>/pt[-_]BR/i.test(v.lang)).map(v=>'<option '+(C.vz==v.name?'selected':'')+'>'+esc(v.name)+'</option>').join(''):'')+'</select><button class=b onclick="say(\'á, má, ré, lô. Amarelo.\')">▶ Testar voz</button><p class=sub>Os dados ficam salvos apenas neste dispositivo. Nenhuma gravação de voz é armazenada.</p></div>';
function cf(k,v){C[k]=['nm','m','ch','vz'].includes(k)?v:+v;if(k=='nm')D.nm1=1;sv();ap()}
function go(v){stop();V=v;$('app').innerHTML=T[v]();$('bk').style.display=v=='home'?'none':'';window.scrollTo(0,0);if(v=='evo')setTimeout(chart,0)}
cur=D.cur||null;ap();go('home');if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(V=='cfg')go('cfg')};
fetch('alunos.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{mergeA(j);if(V=='home'||V=='pac')go(V)}).catch(()=>{});
</script></body></html>
